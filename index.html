<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAP DAVID - Suivi Médical Cloud</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .gradient-medical { background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
    </style>
</head>
<body class="min-h-screen">

    <header class="gradient-medical text-white shadow-lg p-6 mb-8">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold tracking-tight uppercase">Cap David Medical</h1>
                <p class="text-blue-100 opacity-90">Suivi synchronisé en temps réel</p>
            </div>
            
            <div id="countdown" class="mt-4 md:mt-0 flex gap-4 glass-card rounded-xl p-4">
                <div class="text-center">
                    <span id="days" class="block text-2xl font-bold">00</span>
                    <span class="text-[10px] uppercase">Jours</span>
                </div>
                <div class="text-2xl font-bold self-center">:</div>
                <div class="text-center">
                    <span id="hours" class="block text-2xl font-bold">00</span>
                    <span class="text-[10px] uppercase">Heures</span>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 pb-12">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            
            <aside class="lg:col-span-1">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sticky top-8">
                    <div class="flex items-center justify-between mb-4 px-2">
                        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Phases</h2>
                        <span id="cloud-status" class="text-[10px] bg-green-100 text-green-600 px-2 py-0.5 rounded-full font-bold">Cloud Actif</span>
                    </div>
                    <nav id="nav-container" class="space-y-1">
                        </nav>
                    <button onclick="addPhase()" class="mt-6 w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl transition-all font-semibold shadow-md shadow-blue-200">
                        <i class="fa-solid fa-plus-circle"></i> Ajouter une Phase
                    </button>
                </div>
            </aside>

            <section class="lg:col-span-3">
                <div class="bg-white rounded-3xl shadow-xl border border-slate-100 min-h-[500px] overflow-hidden">
                    <div class="bg-slate-50 border-b border-slate-100 p-6 flex justify-between items-center">
                        <h2 id="current-tab-title" class="text-2xl font-bold text-slate-800">Chargement...</h2>
                        <div class="flex gap-4">
                            <button onclick="downloadFile()" title="Exporter HTML local" class="text-slate-400 hover:text-slate-600 transition-colors">
                                <i class="fa-solid fa-file-export"></i>
                            </button>
                        </div>
                    </div>

                    <div id="main-content" class="p-8">
                        </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        // --- CONFIGURATION FIREBASE (Vos identifiants) ---
        const firebaseConfig = {
            apiKey: "AIzaSyBC0gg7v8KQltQskGo6PUaFq_megSwlixQ",
            authDomain: "capdavid-5cb65.firebaseapp.com",
            databaseURL: "https://capdavid-5cb65-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "capdavid-5cb65",
            storageBucket: "capdavid-5cb65.firebasestorage.app",
            messagingSenderId: "346917679110",
            appId: "1:346917679110:web:2b76ad31621eec618ed387",
            measurementId: "G-GHTM9M5WCD"
        };

        // Initialisation de Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let appData = {
            activeTab: 'roadmap',
            roadmap: [{ id: 'roadmap', title: 'Tableau de bord' }]
        };

        // --- SYNCHRONISATION CLOUD ---
        function loadFromCloud() {
            db.ref('appData').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    appData = data;
                    renderNav();
                    renderContent();
                }
            });
        }

        function saveToCloud() {
            db.ref('appData').set(appData);
        }

        // --- LOGIQUE INTERFACE ---
        function renderNav() {
            const container = document.getElementById('nav-container');
            container.innerHTML = appData.roadmap.map(phase => `
                <div class="group flex items-center justify-between">
                    <button onclick="switchTab('${phase.id}')" 
                        class="flex-grow text-left px-4 py-3 rounded-xl transition-all font-medium ${appData.activeTab === phase.id ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-600 hover:bg-slate-100'}">
                        ${phase.title}
                    </button>
                    ${phase.id !== 'roadmap' ? `
                        <button onclick="deletePhase('${phase.id}')" class="opacity-0 group-hover:opacity-100 p-2 text-red-400 hover:text-red-600 transition-all">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    ` : ''}
                </div>
            `).join('');
        }

        function switchTab(id) {
            appData.activeTab = id;
            saveToCloud(); // Synchronise le changement d'onglet actif
        }

        function renderContent() {
            const phase = appData.roadmap.find(p => p.id === appData.activeTab) || appData.roadmap[0];
            document.getElementById('current-tab-title').innerText = phase.title;
            
            const contentArea = document.getElementById('main-content');
            if (phase.id === 'roadmap') {
                contentArea.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="p-8 bg-blue-50 rounded-3xl border border-blue-100 relative overflow-hidden">
                            <i class="fa-solid fa-heart-pulse absolute -right-4 -bottom-4 text-8xl text-blue-100"></i>
                            <h3 class="font-bold text-xl text-blue-800 mb-2">Bienvenue David</h3>
                            <p class="text-blue-600 text-sm leading-relaxed relative z-10">
                                Vos données sont actuellement synchronisées sur votre base Firebase en Europe-West1. 
                                Toute modification sur cet écran est répercutée instantanément sur vos autres appareils.
                            </p>
                        </div>
                        <div class="p-8 bg-slate-50 rounded-3xl border border-slate-100 flex flex-col items-center justify-center">
                            <span class="text-xs font-bold text-slate-400 uppercase mb-2">Échéance finale</span>
                            <span class="text-xl font-bold text-slate-800">1er Septembre 2026</span>
                        </div>
                    </div>
                `;
            } else {
                contentArea.innerHTML = `
                    <div class="bg-slate-50 rounded-3xl p-16 text-center border-2 border-dashed border-slate-200">
                        <div class="bg-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm text-blue-600 text-xl">
                            <i class="fa-solid fa-folder-open"></i>
                        </div>
                        <p class="text-slate-500 font-medium">Contenu de la phase : ${phase.title}</p>
                        <button onclick="editPhaseName('${phase.id}')" class="mt-4 text-blue-600 hover:text-blue-800 font-bold text-sm underline decoration-2 underline-offset-4">
                            Renommer cet onglet
                        </button>
                    </div>
                `;
            }
        }

        function addPhase() {
            const name = prompt("Nom de la phase :");
            if (name) {
                const id = 'phase_' + Date.now();
                appData.roadmap.push({ id, title: name });
                appData.activeTab = id;
                saveToCloud();
            }
        }

        function deletePhase(id) {
            if (confirm("Supprimer définitivement du Cloud ?")) {
                appData.roadmap = appData.roadmap.filter(p => p.id !== id);
                appData.activeTab = 'roadmap';
                saveToCloud();
            }
        }

        function editPhaseName(id) {
            const phase = appData.roadmap.find(p => p.id === id);
            const newName = prompt("Nouveau nom :", phase.title);
            if (newName) {
                phase.title = newName;
                saveToCloud();
            }
        }

        function updateCountdown() {
            const target = new Date("2026-09-01").getTime();
            const now = new Date().getTime();
            const diff = target - now;
            if (diff > 0) {
                document.getElementById('days').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
                document.getElementById('hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
            }
        }

        function downloadFile() {
            const blob = new Blob([document.documentElement.outerHTML], {type: 'text/html'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'CAP_DAVID_MEDICAL_CLOUD.html';
            a.click();
        }

        // Initialisation au chargement
        window.onload = () => {
            loadFromCloud();
            updateCountdown();
            setInterval(updateCountdown, 60000);
        };
    </script>
</body>
</html>
