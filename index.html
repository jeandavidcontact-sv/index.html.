<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAVID MÉDICAL - Suivi de Projet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            color: #1e293b;
            background-color: #f8fafc;
        }

        .premium-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            border-radius: 2.5rem;
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .nav-tab {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            padding: 0.75rem 1.25rem;
            border-radius: 1rem;
        }

        .nav-tab.active {
            background-color: #4f46e5;
            color: white;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.3);
        }

        .modern-notif {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .notif-pulse {
            position: absolute;
            top: -2px;
            right: -2px;
            background: #ef4444; 
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
            animation: pulse-ring-red 2s infinite;
        }

        @keyframes pulse-ring-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .btn-modern-add {
            background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .btn-modern-add:hover {
            filter: brightness(1.05);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -10px rgba(79, 70, 229, 0.5);
        }

        .category-card {
            background: #ffffff;
            border-radius: 1.75rem;
            border: 1px solid rgba(226, 232, 240, 0.6);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .category-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.08);
            border-color: rgba(79, 70, 229, 0.2);
        }

        .timeline-scroll {
            display: flex;
            overflow-x: auto;
            gap: 1.5rem;
            padding-bottom: 1rem;
            scrollbar-width: none;
        }
        .timeline-scroll::-webkit-scrollbar { display: none; }

        .timeline-item {
            min-width: 280px;
            background: white;
            border: 1px solid #f1f5f9;
            padding: 1.25rem;
            border-radius: 1.25rem;
            position: relative;
            transition: all 0.3s ease;
        }
        .timeline-item:hover {
            border-color: #4f46e5;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.1);
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #f1f5f9;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #4f46e5, #06b6d4);
            transition: width 0.8s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .task-item {
            border-radius: 1rem;
            padding: 1rem;
            background: #fcfdfe;
            border: 1px solid #f1f5f9;
            transition: all 0.25s ease;
        }

        .task-item:hover {
            background: #ffffff;
            border-color: #4f46e533;
            transform: scale(1.01);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        .task-done {
            opacity: 0.6;
            background-color: #f8fafc;
            filter: grayscale(0.5);
        }

        .status-badge {
            cursor: pointer;
            font-size: 10px;
            font-weight: 700;
            padding: 0.5rem 0.8rem;
            border-radius: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            transition: all 0.2s ease;
        }

        .date-container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: #f1f5f9;
            padding: 0.35rem 0.75rem;
            border-radius: 0.6rem;
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
        }

        .saas-delete-btn {
            color: #94a3b8;
            transition: all 0.2s ease;
            padding: 6px;
            border-radius: 8px;
        }

        .saas-delete-btn:hover {
            color: #4f46e5;
            background-color: #eef2ff;
        }

        #confirm-modal, #notif-modal, #late-info-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(12px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-card {
            background: white;
            padding: 2.5rem;
            border-radius: 2rem;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.25);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-card {
            animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        #app-loader {
            position: fixed;
            inset: 0;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="app-loader">
        <div class="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-4"></div>
        <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">Synchronisation Cloud...</p>
    </div>

    <div id="app" class="max-w-6xl mx-auto hidden">
        <header class="premium-header text-white p-12 md:p-16 mb-10 shadow-2xl relative overflow-hidden text-center">
            <div class="absolute top-0 left-0 w-full h-full opacity-5 bg-[linear-gradient(to_right,#80808012_1px,transparent_1px),linear-gradient(to_bottom,#80808012_1px,transparent_1px)] [background-size:32px_32px]"></div>
            
            <div class="absolute top-8 right-8 z-20">
                <button id="notif-bell" class="modern-notif p-3.5 rounded-2xl relative">
                    <i data-lucide="bell" class="w-5 h-5 text-slate-300"></i>
                    <span id="notif-badge" class="notif-pulse w-4 h-4 rounded-full flex items-center justify-center text-[8px] font-black text-white hidden">0</span>
                </button>
            </div>

            <div class="relative z-10 flex flex-col items-center gap-6">
                <h1 class="text-6xl md:text-7xl font-black tracking-tighter uppercase mb-0 drop-shadow-2xl">DAVID MEDICAL</h1>
                <div id="countdown" class="flex gap-4">
                    <!-- Countdown boxes rendered by JS -->
                </div>
                <div id="global-status-container"></div>
            </div>
        </header>

        <div class="glass-nav flex items-center gap-2 mb-8 p-3 rounded-3xl sticky top-4 z-50 shadow-xl shadow-slate-200/40">
            <nav id="tabs-container" class="flex items-center gap-1 overflow-x-auto flex-grow px-1"></nav>
            <button id="add-tab-btn" class="btn-modern-add flex items-center gap-2 px-6 py-3.5 text-white font-bold text-[10px] uppercase tracking-widest rounded-2xl">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Nouveau Projet</span>
            </button>
        </div>

        <main id="main-content" class="min-h-[600px]"></main>
    </div>

    <!-- Modals -->
    <div id="confirm-modal">
        <div class="modal-card text-center">
            <h3 class="text-2xl font-black text-slate-900 mb-2">Confirmer ?</h3>
            <p id="confirm-desc" class="text-slate-500 text-sm mb-8">Cette action est définitive.</p>
            <div class="flex gap-4">
                <button id="confirm-delete-btn" class="flex-1 py-4 bg-slate-900 text-white font-bold rounded-2xl">Supprimer</button>
                <button id="cancel-delete-btn" class="flex-1 py-4 bg-slate-100 text-slate-600 font-bold rounded-2xl">Annuler</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBC0gg7v8KQltQskGo6PUaFq_megSwlixQ",
            authDomain: "capdavid-5cb65.firebaseapp.com",
            databaseURL: "https://capdavid-5cb65-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "capdavid-5cb65",
            storageBucket: "capdavid-5cb65.firebasestorage.app",
            messagingSenderId: "346917679110",
            appId: "1:346917679110:web:2b76ad31621eec618ed387"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'capdavid-5cb65';

        // --- ÉTAT ---
        let tabs = [];
        let activeTabId = 'dashboard';
        let isInitialLoad = true;
        let pendingDeleteAction = null;

        const STATES = {
            'todo': { label: 'À faire', bg: 'bg-slate-100', text: 'text-slate-500' },
            'in-progress': { label: 'En cours', bg: 'bg-indigo-50', text: 'text-indigo-600' },
            'done': { label: 'Terminée', bg: 'bg-emerald-50', text: 'text-emerald-600' }
        };

        // --- FIREBASE SYNC (FIXED PATHS) ---
        async function saveToCloud() {
            if (isInitialLoad) return;
            try {
                // Règle d'or : /artifacts/{appId}/public/data/{collectionName}/{docId}
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'app_state', 'main');
                await setDoc(docRef, { 
                    tabs, 
                    updatedAt: Date.now() 
                });
            } catch (err) {
                console.error("Cloud Save Error:", err);
            }
        }

        function initSync() {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'app_state', 'main');
            onSnapshot(docRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.data();
                    if (JSON.stringify(data.tabs) !== JSON.stringify(tabs)) {
                        tabs = data.tabs;
                        finishLoading();
                    }
                } else if (isInitialLoad) {
                    tabs = [
                        { id: 'dashboard', title: 'Dashboard', isDashboard: true, categories: [] },
                        { id: 'proj1', title: 'Mon Premier Projet', isDashboard: false, categories: [] }
                    ];
                    isInitialLoad = false;
                    saveToCloud();
                    finishLoading();
                }
            }, (err) => {
                console.error("Cloud Sync Error:", err);
                document.getElementById('app-loader').innerHTML = '<p class="text-red-500">Erreur de permissions Firebase.</p>';
            });
        }

        function finishLoading() {
            isInitialLoad = false;
            document.getElementById('app-loader').style.display = 'none';
            document.getElementById('app').classList.remove('hidden');
            render();
        }

        // --- RENDERING ---
        function render() {
            renderTabs();
            renderContent();
            if (window.lucide) window.lucide.createIcons();
        }

        function renderTabs() {
            const container = document.getElementById('tabs-container');
            container.innerHTML = '';
            tabs.forEach(tab => {
                const isActive = tab.id === activeTabId;
                const el = document.createElement('div');
                el.className = `nav-tab cursor-pointer text-[10px] font-bold uppercase tracking-widest ${isActive ? 'active' : 'text-slate-400'}`;
                el.innerHTML = `<span>${tab.title}</span>`;
                el.onclick = () => { activeTabId = tab.id; render(); };
                container.appendChild(el);
            });
        }

        function renderContent() {
            const content = document.getElementById('main-content');
            const activeTab = tabs.find(t => t.id === activeTabId);
            if (!activeTab) return;

            if (activeTab.isDashboard) {
                content.innerHTML = `<div class="p-8 text-center text-slate-400 font-bold uppercase tracking-widest">Bienvenue sur votre Dashboard</div>`;
            } else {
                content.innerHTML = `
                    <div class="flex flex-col gap-8 p-4">
                        <input type="text" value="${activeTab.title}" class="text-4xl font-black bg-transparent outline-none" onblur="window.renameTab('${activeTab.id}', this.value)">
                        <button onclick="window.addCategory()" class="w-fit px-6 py-3 bg-indigo-600 text-white rounded-xl font-bold text-xs uppercase">Ajouter une Section</button>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            ${activeTab.categories.map(cat => `
                                <div class="category-card p-6 bg-white rounded-3xl border border-slate-100 shadow-sm">
                                    <h3 class="font-black text-xl mb-4">${cat.title}</h3>
                                    <div class="flex flex-col gap-3">
                                        ${cat.tasks.map(task => `
                                            <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl">
                                                <span class="text-sm font-bold text-slate-700">${task.text}</span>
                                                <div class="px-3 py-1 text-[10px] font-black uppercase rounded-lg ${STATES[task.status].bg} ${STATES[task.status].text}">${STATES[task.status].label}</div>
                                            </div>
                                        `).join('')}
                                        <input type="text" placeholder="+ Ajouter tâche..." class="p-3 bg-transparent border-2 border-dashed border-slate-100 rounded-xl text-xs outline-none focus:border-indigo-200" onkeydown="if(event.key==='Enter' && this.value) { window.addTask('${cat.id}', this.value); this.value=''; }">
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
        }

        // --- ACTIONS ---
        window.renameTab = (id, val) => {
            const t = tabs.find(x => x.id === id);
            if(t) { t.title = val; saveToCloud(); render(); }
        };

        window.addCategory = () => {
            const t = tabs.find(x => x.id === activeTabId);
            if(t) { 
                t.categories.push({ id: Date.now(), title: 'Nouvelle Section', tasks: [] }); 
                saveToCloud(); render(); 
            }
        };

        window.addTask = (catId, text) => {
            const t = tabs.find(x => x.id === activeTabId);
            const cat = t.categories.find(c => c.id == catId);
            if(cat) {
                cat.tasks.push({ id: Date.now(), text, status: 'todo' });
                saveToCloud(); render();
            }
        };

        // --- INIT ---
        async function start() {
            try {
                await signInAnonymously(auth);
                initSync();
            } catch (err) {
                console.error("Auth Error:", err);
            }
        }
        start();

    </script>
</body>
</html>
