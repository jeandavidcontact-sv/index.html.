<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAVID MÉDICAL - Suivi de Projet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        .premium-header {
            background: linear-gradient(135deg, #111827 0%, #1e293b 100%);
            border-radius: 2rem;
        }

        .nav-tab {
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-tab.active {
            color: #6366f1;
        }

        .nav-tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #6366f1;
            border-radius: 2px;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">

    <div id="app" class="max-w-7xl mx-auto">
        
        <!-- Header Minimaliste David Médical -->
        <header class="premium-header text-white p-12 md:p-16 mb-6 shadow-2xl relative overflow-hidden flex items-center justify-center">
            <div class="absolute inset-0 bg-indigo-500/5 blur-3xl rounded-full transform scale-150"></div>
            
            <div class="relative z-10 text-center">
                <h1 class="text-5xl md:text-7xl font-extrabold tracking-tighter uppercase">
                    DAVID MÉDICAL
                </h1>
            </div>
        </header>

        <!-- Nouveau bandeau de navigation -->
        <nav class="bg-white rounded-2xl shadow-sm border border-slate-100 p-2 mb-8 flex items-center gap-2 overflow-x-auto">
            <button onclick="switchPage('dashboard')" id="tab-dashboard" class="nav-tab active px-6 py-2 text-sm font-bold uppercase tracking-wider text-slate-500 hover:text-indigo-500">
                Tableau de bord
            </button>
            <button onclick="switchPage('missions')" id="tab-missions" class="nav-tab px-6 py-2 text-sm font-bold uppercase tracking-wider text-slate-500 hover:text-indigo-500">
                Missions
            </button>
            <button onclick="switchPage('equipe')" id="tab-equipe" class="nav-tab px-6 py-2 text-sm font-bold uppercase tracking-wider text-slate-500 hover:text-indigo-500">
                Équipe
            </button>
            <button onclick="switchPage('parametres')" id="tab-parametres" class="nav-tab px-6 py-2 text-sm font-bold uppercase tracking-wider text-slate-500 hover:text-indigo-500">
                Paramètres
            </button>
        </nav>

        <!-- Zone de contenu dynamique -->
        <main id="main-content" class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 min-h-[300px]">
            <div id="page-dashboard">
                <h2 class="text-2xl font-bold text-slate-800 mb-4">Bienvenue sur le tableau de bord</h2>
                <p class="text-slate-500">Sélectionnez un onglet pour naviguer dans l'application.</p>
            </div>
            <div id="page-missions" class="hidden">
                <h2 class="text-2xl font-bold text-slate-800 mb-4">Gestion des Missions</h2>
                <p class="text-slate-500">Liste des projets en cours et terminés.</p>
            </div>
            <div id="page-equipe" class="hidden">
                <h2 class="text-2xl font-bold text-slate-800 mb-4">Membres de l'Équipe</h2>
                <p class="text-slate-500">Gérez les collaborateurs et les accès.</p>
            </div>
            <div id="page-parametres" class="hidden">
                <h2 class="text-2xl font-bold text-slate-800 mb-4">Paramètres</h2>
                <p class="text-slate-500">Configuration du compte et des notifications.</p>
            </div>
        </main>
        
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // Configuration Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBC0gg7v8KQltQskGo6PUaFq_megSwlixQ",
            authDomain: "capdavid-5cb65.firebaseapp.com",
            databaseURL: "https://capdavid-5cb65-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "capdavid-5cb65",
            storageBucket: "capdavid-5cb65.firebasestorage.app",
            messagingSenderId: "346917679110",
            appId: "1:346917679110:web:2b76ad31621eec618ed387",
            measurementId: "G-GHTM9M5WCD"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        async function initAuth() {
            try {
                await signInAnonymously(auth);
            } catch (error) {
                console.error("Auth error:", error);
            }
        }

        // Fonction de navigation globale
        window.switchPage = (pageId) => {
            // Masquer toutes les pages
            document.querySelectorAll('#main-content > div').forEach(div => div.classList.add('hidden'));
            // Afficher la page sélectionnée
            document.getElementById(`page-${pageId}`).classList.remove('hidden');
            
            // Mettre à jour les styles des onglets
            document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
            document.getElementById(`tab-${pageId}`).classList.add('active');
        };

        initAuth();
    </script>
</body>
</html>
