<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAVID MÉDICAL - Suivi de Projet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            color: #1e293b;
        }

        .premium-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border-radius: 2.5rem;
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .nav-tab {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .nav-tab.active {
            background-color: white;
            color: #4f46e5;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .nav-tab:not(.active):hover {
            background-color: rgba(241, 245, 249, 0.8);
            color: #334155;
        }

        .tab-action-btn {
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-tab:hover .tab-action-btn {
            opacity: 1;
            transform: scale(1);
        }

        .delete-btn-premium {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: transparent;
            color: #94a3b8;
            transition: all 0.2s ease;
        }

        .delete-btn-premium:hover {
            background: #fee2e2;
            color: #ef4444;
        }

        .category-card {
            background: white;
            border: 1px solid #f1f5f9;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .category-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: #4f46e5;
            opacity: 0.1;
        }

        .category-card:hover {
            border-color: #e2e8f0;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            transform: translateY(-2px);
        }

        .category-card:hover::before {
            opacity: 1;
        }

        .task-item {
            border-radius: 0.75rem;
            transition: all 0.2s ease;
        }

        .task-item:hover {
            background: #f8fafc;
        }

        .status-badge {
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .status-badge:active {
            transform: scale(0.95);
        }

        .tab-input:focus {
            outline: none;
            background: #f8fafc;
            padding: 2px 6px;
            border-radius: 6px;
        }

        /* Masquer le calendrier par défaut de l'input date pour un look plus propre */
        input[type="date"]::-webkit-calendar-picker-indicator {
            opacity: 0.4;
            cursor: pointer;
        }

        #tabs-container::-webkit-scrollbar { display: none; }
        #tabs-container { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-10">

    <div id="app" class="max-w-7xl mx-auto">
        
        <header class="premium-header text-white p-14 md:p-20 mb-10 shadow-2xl relative overflow-hidden flex items-center justify-center">
            <div class="absolute inset-0 bg-indigo-500/10 blur-3xl rounded-full transform scale-150 translate-y-1/2"></div>
            <div class="relative z-10 text-center">
                <h1 class="text-6xl md:text-8xl font-extrabold tracking-tighter uppercase mb-2">DAVID MÉDICAL</h1>
                <p class="text-indigo-300 font-medium tracking-widest uppercase text-sm opacity-80">Gestion de Projets & Tâches</p>
            </div>
        </header>

        <div class="glass-nav flex items-center gap-3 mb-10 p-2.5 rounded-3xl shadow-sm sticky top-6 z-50">
            <nav id="tabs-container" class="flex items-center gap-2 overflow-x-auto flex-grow px-2">
                <!-- Onglets injectés ici -->
            </nav>
            <button id="add-tab-btn" class="flex items-center gap-2 px-5 py-2.5 text-white bg-indigo-600 hover:bg-indigo-700 font-semibold text-xs uppercase tracking-widest rounded-2xl transition-all shadow-md active:scale-95">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Nouveau Projet</span>
            </button>
        </div>

        <main id="main-content" class="bg-white p-8 md:p-12 rounded-[3rem] shadow-sm border border-slate-100 min-h-[500px]">
            <!-- Contenu dynamique -->
        </main>
        
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBC0gg7v8KQltQskGo6PUaFq_megSwlixQ",
            authDomain: "capdavid-5cb65.firebaseapp.com",
            projectId: "capdavid-5cb65",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        // États possibles : 'todo', 'in-progress', 'done'
        const STATES = {
            'todo': { label: 'À faire', bg: 'bg-slate-100', text: 'text-slate-600' },
            'in-progress': { label: 'En cours', bg: 'bg-amber-100', text: 'text-amber-700' },
            'done': { label: 'Terminé', bg: 'bg-emerald-100', text: 'text-emerald-700' }
        };

        let tabs = [
            { 
                id: 'dashboard', 
                title: 'Tableau de bord', 
                isDashboard: true,
                categories: [] 
            },
            { 
                id: 'tab2', 
                title: 'Projets Clients', 
                isDashboard: false,
                categories: [
                    {
                        id: 'cat1',
                        title: 'Phase Initiale',
                        tasks: [
                            { id: 't1', text: 'Analyse des besoins', status: 'done', date: '2024-03-20' },
                            { id: 't2', text: 'Validation devis', status: 'in-progress', date: '2024-03-25' }
                        ]
                    }
                ] 
            }
        ];
        
        let activeTabId = 'dashboard';

        const container = document.getElementById('tabs-container');
        const contentArea = document.getElementById('main-content');
        const addBtn = document.getElementById('add-tab-btn');

        function render() {
            renderTabs();
            renderContent();
            if (window.lucide) window.lucide.createIcons();
        }

        function renderTabs() {
            container.innerHTML = '';
            tabs.forEach(tab => {
                const isActive = tab.id === activeTabId;
                const tabEl = document.createElement('div');
                tabEl.className = `nav-tab flex items-center gap-2 px-4 py-2.5 rounded-2xl cursor-pointer font-semibold text-[11px] uppercase tracking-widest ${isActive ? 'active' : 'text-slate-500'}`;
                
                const label = document.createElement('span');
                label.className = 'tab-input outline-none whitespace-nowrap';
                label.contentEditable = isActive && !tab.isDashboard; 
                label.innerText = tab.title;
                
                label.onblur = () => {
                    if(!tab.isDashboard) {
                        tab.title = label.innerText.trim() || "Sans titre";
                        render();
                    }
                };

                label.onkeydown = (e) => { if(e.key === 'Enter') { e.preventDefault(); label.blur(); } };
                tabEl.appendChild(label);

                if (!tab.isDashboard) {
                    const del = document.createElement('button');
                    del.className = 'delete-btn-premium tab-action-btn ml-1';
                    del.innerHTML = '<i data-lucide="x" class="w-3.5 h-3.5"></i>';
                    del.onclick = (e) => { e.stopPropagation(); deleteTab(tab.id); };
                    tabEl.appendChild(del);
                }

                tabEl.onclick = () => { activeTabId = tab.id; render(); };
                container.appendChild(tabEl);
            });
        }

        function renderContent() {
            const activeTab = tabs.find(t => t.id === activeTabId);
            if (!activeTab) return;

            if (activeTab.isDashboard) {
                contentArea.innerHTML = `
                    <div class="max-w-4xl">
                        <h2 class="text-4xl font-extrabold text-slate-900 mb-6">Tableau de bord</h2>
                        <p class="text-slate-500 text-lg">Bienvenue dans votre interface de gestion centralisée.</p>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-12">
                            <div class="p-6 bg-slate-50 rounded-3xl border border-slate-100">
                                <div class="text-indigo-600 font-bold text-3xl mb-1">${tabs.length - 1}</div>
                                <div class="text-slate-500 uppercase text-[10px] tracking-widest font-bold">Projets Actifs</div>
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            contentArea.innerHTML = `
                <div class="flex flex-col gap-10">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">${activeTab.title}</h2>
                        <button onclick="window.addCategory()" class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-indigo-600 text-white rounded-2xl text-[10px] font-bold uppercase tracking-widest hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-100 active:scale-95">
                            <i data-lucide="layout-grid" class="w-4 h-4"></i> Ajouter une catégorie
                        </button>
                    </div>
                    
                    <div class="grid grid-cols-1 xl:grid-cols-2 gap-8" id="categories-grid">
                        ${activeTab.categories.map(cat => renderCategory(cat)).join('')}
                    </div>
                </div>
            `;
        }

        function renderCategory(cat) {
            return `
                <div class="category-card rounded-[2.5rem] p-7 flex flex-col gap-6">
                    <div class="flex items-center justify-between gap-2">
                        <input type="text" value="${cat.title}" 
                            class="font-extrabold text-slate-800 text-base outline-none w-full bg-transparent focus:text-indigo-600 placeholder:text-slate-300"
                            onblur="window.updateCategoryTitle('${cat.id}', this.value)"
                            placeholder="Titre de catégorie">
                        <button onclick="window.deleteCategory('${cat.id}')" class="text-slate-300 hover:text-rose-500 p-2 transition-colors rounded-xl hover:bg-rose-50">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                    
                    <div class="flex flex-col gap-2">
                        ${cat.tasks.map(task => {
                            const state = STATES[task.status] || STATES['todo'];
                            return `
                                <div class="task-item flex flex-col sm:flex-row sm:items-center gap-3 p-3 group">
                                    <div class="flex items-center gap-3 flex-grow">
                                        <div onclick="window.cycleStatus('${cat.id}', '${task.id}')" 
                                             class="status-badge px-3 py-1 rounded-full text-[9px] font-bold uppercase tracking-wider whitespace-nowrap ${state.bg} ${state.text}">
                                            ${state.label}
                                        </div>
                                        <input type="text" value="${task.text}" 
                                            class="text-sm font-medium text-slate-600 outline-none flex-grow bg-transparent transition-all ${task.status === 'done' ? 'line-through opacity-40 italic' : ''}"
                                            onblur="window.updateTaskText('${cat.id}', '${task.id}', this.value)"
                                            placeholder="Description de la tâche">
                                    </div>
                                    
                                    <div class="flex items-center gap-4 pl-12 sm:pl-0 justify-between sm:justify-end">
                                        <input type="date" value="${task.date || ''}"
                                            class="text-[11px] font-bold text-slate-400 bg-transparent outline-none uppercase"
                                            onchange="window.updateTaskDate('${cat.id}', '${task.id}', this.value)">
                                        
                                        <button onclick="window.deleteTask('${cat.id}', '${task.id}')" class="opacity-0 group-hover:opacity-100 text-slate-300 hover:text-rose-500 p-1 transition-all">
                                            <i data-lucide="x-circle" class="w-4 h-4"></i>
                                        </button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                        
                        ${cat.tasks.length === 0 ? '<p class="text-[11px] text-slate-400 italic px-3 py-4">Aucune tâche pour le moment.</p>' : ''}
                    </div>
                    
                    <button onclick="window.addTask('${cat.id}')" class="group mt-auto flex items-center gap-2 text-[10px] font-extrabold uppercase tracking-[0.1em] text-slate-400 hover:text-indigo-600 transition-all">
                        <div class="w-6 h-6 rounded-lg bg-slate-50 flex items-center justify-center group-hover:bg-indigo-50 transition-colors">
                            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                        </div>
                        Ajouter une tâche
                    </button>
                </div>
            `;
        }

        // --- FONCTIONS GLOBALES ---
        
        window.cycleStatus = (catId, taskId) => {
            const activeTab = tabs.find(t => t.id === activeTabId);
            const cat = activeTab.categories.find(c => c.id === catId);
            const task = cat.tasks.find(t => t.id === taskId);
            
            const statusOrder = ['todo', 'in-progress', 'done'];
            let currentIndex = statusOrder.indexOf(task.status);
            task.status = statusOrder[(currentIndex + 1) % statusOrder.length];
            render();
        };

        window.updateTaskDate = (catId, taskId, newDate) => {
            const activeTab = tabs.find(t => t.id === activeTabId);
            const cat = activeTab.categories.find(c => c.id === catId);
            const task = cat.tasks.find(t => t.id === taskId);
            task.date = newDate;
        };

        window.addCategory = () => {
            const activeTab = tabs.find(t => t.id === activeTabId);
            activeTab.categories.push({
                id: 'cat' + Date.now(),
                title: '',
                tasks: []
            });
            render();
        };

        window.updateCategoryTitle = (catId, newTitle) => {
            const activeTab = tabs.find(t => t.id === activeTabId);
            const cat = activeTab.categories.find(c => c.id === catId);
            if (cat) cat.title = newTitle;
        };

        window.deleteCategory = (catId) => {
            const activeTab = tabs.find(t => t.id === activeTabId);
            activeTab.categories = activeTab.categories.filter(c => c.id !== catId);
            render();
        };

        window.addTask = (catId) => {
            const activeTab = tabs.find(t => t.id === activeTabId);
            const cat = activeTab.categories.find(c => c.id === catId);
            cat.tasks.push({
                id: 'task' + Date.now(),
                text: '',
                status: 'todo',
                date: new Date().toISOString().split('T')[0]
            });
            render();
        };

        window.updateTaskText = (catId, taskId, newText) => {
            const activeTab = tabs.find(t => t.id === activeTabId);
            const cat = activeTab.categories.find(c => c.id === catId);
            const task = cat.tasks.find(t => t.id === taskId);
            task.text = newText;
        };

        window.deleteTask = (catId, taskId) => {
            const activeTab = tabs.find(t => t.id === activeTabId);
            const cat = activeTab.categories.find(c => c.id === catId);
            cat.tasks = cat.tasks.filter(t => t.id !== taskId);
            render();
        };

        function deleteTab(id) {
            tabs = tabs.filter(t => t.id !== id);
            if (activeTabId === id) activeTabId = 'dashboard';
            render();
        }

        addBtn.onclick = () => {
            const newId = 'tab' + Date.now();
            tabs.push({ id: newId, title: 'Nouveau Projet', isDashboard: false, categories: [] });
            activeTabId = newId;
            render();
        }

        async function initAuth() {
            try { await signInAnonymously(auth); render(); } catch (e) { render(); }
        }
        initAuth();
    </script>
</body>
</html>
