<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAVID MÉDICAL - Suivi de Projet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        .premium-header {
            background: linear-gradient(135deg, #111827 0%, #1e293b 100%);
            border-radius: 2rem;
        }

        .nav-tab {
            transition: all 0.2s ease;
            position: relative;
        }

        .nav-tab.active {
            background-color: #f8fafc;
            color: #6366f1;
            border-bottom: 2px solid #6366f1;
        }

        .edit-btn, .delete-btn {
            opacity: 0;
            transition: opacity 0.2s;
        }

        .nav-tab:hover .edit-btn, 
        .nav-tab:hover .delete-btn {
            opacity: 1;
        }

        .tab-label-input:focus {
            outline: none;
            background: #f1f5f9;
            padding: 2px 4px;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">

    <div id="app" class="max-w-7xl mx-auto">
        
        <!-- Header Minimaliste David Médical -->
        <header class="premium-header text-white p-12 md:p-16 mb-6 shadow-2xl relative overflow-hidden flex items-center justify-center">
            <div class="absolute inset-0 bg-indigo-500/5 blur-3xl rounded-full transform scale-150"></div>
            
            <div class="relative z-10 text-center">
                <h1 class="text-5xl md:text-7xl font-extrabold tracking-tighter uppercase">
                    DAVID MÉDICAL
                </h1>
            </div>
        </header>

        <!-- Bandeau de Navigation Dynamique -->
        <div class="flex items-center gap-2 mb-8 bg-white p-2 rounded-2xl shadow-sm border border-slate-100">
            <nav id="tabs-list" class="flex items-center gap-1 overflow-x-auto flex-grow">
                <!-- Les onglets seront injectés ici -->
            </nav>
            <button id="add-tab" class="p-2 text-slate-400 hover:text-indigo-600 transition-colors" title="Ajouter un onglet">
                <i data-lucide="plus-circle" class="w-6 h-6"></i>
            </button>
        </div>

        <!-- Zone de Contenu Dynamique -->
        <main id="tab-content" class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 min-h-[400px]">
            <!-- Le contenu de la page active s'affiche ici -->
        </main>
        
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBC0gg7v8KQltQskGo6PUaFq_megSwlixQ",
            authDomain: "capdavid-5cb65.firebaseapp.com",
            databaseURL: "https://capdavid-5cb65-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "capdavid-5cb65",
            storageBucket: "capdavid-5cb65.firebasestorage.app",
            messagingSenderId: "346917679110",
            appId: "1:346917679110:web:2b76ad31621eec618ed387",
            measurementId: "G-GHTM9M5WCD"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        let tabs = [
            { id: '1', title: 'Tableau de bord', content: 'Bienvenue sur votre espace de suivi.' },
            { id: '2', title: 'Missions', content: 'Liste de vos missions en cours.' }
        ];
        let activeTabId = '1';
        let editingTabId = null;

        const tabsList = document.getElementById('tabs-list');
        const tabContentArea = document.getElementById('tab-content');
        const addTabBtn = document.getElementById('add-tab');

        function render() {
            tabsList.innerHTML = '';
            tabs.forEach(tab => {
                const isActive = tab.id === activeTabId;
                const isEditing = tab.id === editingTabId;
                
                const tabEl = document.createElement('div');
                tabEl.className = `nav-tab flex items-center gap-2 px-4 py-2 rounded-xl cursor-pointer font-bold text-sm uppercase tracking-wider ${isActive ? 'active' : 'text-slate-400 hover:bg-slate-50'}`;
                
                // Texte ou Input
                if (isEditing) {
                    const input = document.createElement('span');
                    input.className = 'tab-label-input min-w-[50px]';
                    input.contentEditable = true;
                    input.innerText = tab.title;
                    input.addEventListener('click', (e) => e.stopPropagation());
                    input.addEventListener('keydown', (e) => { 
                        if(e.key === 'Enter') { 
                            e.preventDefault(); 
                            saveEdit(tab.id, input.innerText); 
                        } 
                    });
                    tabEl.appendChild(input);
                    
                    // Bouton Valider
                    const saveBtn = document.createElement('button');
                    saveBtn.className = 'text-emerald-500 hover:text-emerald-600';
                    saveBtn.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i>';
                    saveBtn.onclick = (e) => {
                        e.stopPropagation();
                        saveEdit(tab.id, input.innerText);
                    };
                    tabEl.appendChild(saveBtn);

                    // Focus auto
                    setTimeout(() => input.focus(), 0);
                } else {
                    const label = document.createElement('span');
                    label.innerText = tab.title;
                    tabEl.appendChild(label);

                    // Bouton Crayon
                    const editBtn = document.createElement('button');
                    editBtn.className = 'edit-btn text-slate-300 hover:text-indigo-500 transition-colors ml-1';
                    editBtn.innerHTML = '<i data-lucide="pencil" class="w-3.5 h-3.5"></i>';
                    editBtn.onclick = (e) => {
                        e.stopPropagation();
                        editingTabId = tab.id;
                        render();
                    };
                    tabEl.appendChild(editBtn);

                    // Bouton supprimer
                    if (tabs.length > 1) {
                        const delBtn = document.createElement('button');
                        delBtn.className = 'delete-btn text-slate-300 hover:text-rose-500 transition-colors';
                        delBtn.innerHTML = '<i data-lucide="x" class="w-4 h-4"></i>';
                        delBtn.onclick = (e) => {
                            e.stopPropagation();
                            deleteTab(tab.id);
                        };
                        tabEl.appendChild(delBtn);
                    }
                }

                tabEl.onclick = () => {
                    if (!isEditing) {
                        activeTabId = tab.id;
                        editingTabId = null;
                        render();
                    }
                };

                tabsList.appendChild(tabEl);
            });

            renderContent();
            if (window.lucide) window.lucide.createIcons();
        }

        function saveEdit(id, newTitle) {
            const tab = tabs.find(t => t.id === id);
            if (tab) {
                tab.title = newTitle.trim() || 'Sans titre';
            }
            editingTabId = null;
            render();
        }

        function renderContent() {
            const activeTab = tabs.find(t => t.id === activeTabId);
            if (activeTab) {
                tabContentArea.innerHTML = `
                    <h2 class="text-3xl font-extrabold text-slate-800 mb-6">${activeTab.title}</h2>
                    <div class="text-slate-500">${activeTab.content}</div>
                `;
            }
        }

        function deleteTab(id) {
            tabs = tabs.filter(t => t.id !== id);
            if (activeTabId === id) {
                activeTabId = tabs[0].id;
            }
            render();
        }

        addTabBtn.onclick = () => {
            const newId = Date.now().toString();
            tabs.push({
                id: newId,
                title: 'Nouveau',
                content: 'Contenu de la nouvelle page...'
            });
            activeTabId = newId;
            editingTabId = newId; // Mode édition auto à la création
            render();
        };

        async function initAuth() {
            try {
                await signInAnonymously(auth);
            } catch (error) {
                console.error("Auth error:", error);
            }
        }

        initAuth();
        render();
    </script>
</body>
</html>
