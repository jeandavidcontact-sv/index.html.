<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAVID MÉDICAL - Suivi de Projet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            color: #1e293b;
        }

        .premium-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border-radius: 2.5rem;
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .nav-tab {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .nav-tab.active {
            background-color: white;
            color: #4f46e5;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .nav-tab:not(.active):hover {
            background-color: rgba(241, 245, 249, 0.8);
            color: #334155;
        }

        .edit-icon, .delete-btn {
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.2s ease;
        }

        .nav-tab:hover .edit-icon, 
        .nav-tab:hover .delete-btn {
            opacity: 1;
            transform: scale(1);
        }

        .tab-input:focus {
            outline: none;
            background: #f8fafc;
            padding: 2px 6px;
            border-radius: 6px;
            box-shadow: inset 0 0 0 1px #e2e8f0;
        }

        #tabs-container::-webkit-scrollbar {
            display: none;
        }
        #tabs-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-10">

    <div id="app" class="max-w-7xl mx-auto">
        
        <header class="premium-header text-white p-14 md:p-20 mb-10 shadow-2xl relative overflow-hidden flex items-center justify-center">
            <div class="absolute inset-0 bg-indigo-500/10 blur-3xl rounded-full transform scale-150 translate-y-1/2"></div>
            
            <div class="relative z-10 text-center">
                <h1 class="text-6xl md:text-8xl font-extrabold tracking-tighter uppercase mb-2">
                    DAVID MÉDICAL
                </h1>
                <p class="text-indigo-300 font-medium tracking-widest uppercase text-sm opacity-80">Plateforme de Suivi Expert</p>
            </div>
        </header>

        <div class="glass-nav flex items-center gap-3 mb-10 p-2.5 rounded-3xl shadow-sm sticky top-6 z-50">
            <nav id="tabs-container" class="flex items-center gap-2 overflow-x-auto flex-grow px-2">
                <!-- Onglets injectés ici -->
            </nav>
            
            <button id="add-tab-btn" class="flex items-center gap-2 px-5 py-2.5 text-white bg-indigo-600 hover:bg-indigo-700 font-semibold text-xs uppercase tracking-widest rounded-2xl transition-all shadow-md shadow-indigo-200 active:scale-95">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Nouveau</span>
            </button>
        </div>

        <main id="main-content" class="bg-white p-10 md:p-14 rounded-[3rem] shadow-sm border border-slate-100 min-h-[500px] transition-all duration-500">
            <!-- Contenu dynamique -->
        </main>
        
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBC0gg7v8KQltQskGo6PUaFq_megSwlixQ",
            authDomain: "capdavid-5cb65.firebaseapp.com",
            databaseURL: "https://capdavid-5cb65-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "capdavid-5cb65",
            storageBucket: "capdavid-5cb65.firebasestorage.app",
            messagingSenderId: "346917679110",
            appId: "1:346917679110:web:2b76ad31621eec618ed387",
            measurementId: "G-GHTM9M5WCD"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        // Liste initiale des onglets
        let tabs = [
            { id: 'dashboard', title: 'Tableau de bord', content: 'Bienvenue sur votre espace de pilotage centralisé David Médical.' },
            { id: 'tab2', title: 'Projets Clients', content: 'Consultez ici l\'avancement détaillé de chaque mission médicale.' }
        ];
        let activeTabId = 'dashboard';

        const container = document.getElementById('tabs-container');
        const contentArea = document.getElementById('main-content');
        const addBtn = document.getElementById('add-tab-btn');

        function render() {
            container.innerHTML = '';
            tabs.forEach(tab => {
                const isActive = tab.id === activeTabId;
                const isDashboard = tab.id === 'dashboard';

                const tabEl = document.createElement('div');
                tabEl.className = `nav-tab flex items-center gap-3 px-5 py-3 rounded-2xl cursor-pointer font-semibold text-xs uppercase tracking-widest ${isActive ? 'active' : 'text-slate-500'}`;
                
                const label = document.createElement('span');
                label.className = 'tab-input outline-none whitespace-nowrap';
                label.contentEditable = isActive && !isDashboard; 
                label.innerText = tab.title;
                
                label.onclick = (e) => { 
                    if(isActive) e.stopPropagation(); 
                };
                
                label.onblur = () => {
                    if(!isDashboard) {
                        tab.title = label.innerText.trim() || "Sans titre";
                        render();
                    }
                };

                label.onkeydown = (e) => {
                    if(e.key === 'Enter') { 
                        e.preventDefault(); 
                        label.blur(); 
                    }
                };

                tabEl.appendChild(label);

                // Icône crayon pour l'onglet actif (sauf dashboard)
                if(isActive && !isDashboard) {
                    const pen = document.createElement('i');
                    pen.setAttribute('data-lucide', 'pencil-line');
                    pen.className = 'w-3 h-3 text-indigo-400 edit-icon opacity-40 hover:opacity-100';
                    tabEl.appendChild(pen);
                }

                // Bouton de suppression (croix) - Invisible pour le dashboard
                if (!isDashboard) {
                    const del = document.createElement('button');
                    del.className = 'delete-btn text-slate-300 hover:text-rose-500 ml-1 flex items-center transition-all duration-200';
                    del.innerHTML = '<i data-lucide="x" class="w-4 h-4"></i>';
                    del.onclick = (e) => {
                        e.stopPropagation();
                        deleteTab(tab.id);
                    };
                    tabEl.appendChild(del);
                }

                tabEl.onclick = () => {
                    activeTabId = tab.id;
                    render();
                };

                container.appendChild(tabEl);
            });

            const activeTab = tabs.find(t => t.id === activeTabId);
            if (activeTab) {
                contentArea.style.opacity = '0';
                contentArea.style.transform = 'translateY(10px)';
                
                setTimeout(() => {
                    contentArea.innerHTML = `
                        <div class="max-w-4xl">
                            <h2 class="text-4xl font-extrabold text-slate-900 mb-8 tracking-tight">${activeTab.title}</h2>
                            <div class="text-slate-600 leading-relaxed text-lg">${activeTab.content}</div>
                        </div>
                    `;
                    contentArea.style.opacity = '1';
                    contentArea.style.transform = 'translateY(0)';
                }, 150);
            }

            if (window.lucide) window.lucide.createIcons();
        }

        function deleteTab(id) {
            // Sécurité : on ne peut pas supprimer le tableau de bord
            if (id === 'dashboard') return;

            tabs = tabs.filter(t => t.id !== id);
            
            // Si on supprime l'onglet actif, on redirige vers le tableau de bord
            if (activeTabId === id) {
                activeTabId = 'dashboard';
            }
            render();
        }

        addBtn.onclick = () => {
            const newId = 'tab' + Date.now();
            tabs.push({
                id: newId,
                title: 'Nouveau Dossier',
                content: 'Saisissez ici les détails de votre nouvelle section de suivi.'
            });
            activeTabId = newId;
            render();
            
            setTimeout(() => {
                const lastTab = container.lastElementChild;
                if (lastTab) {
                    const label = lastTab.querySelector('.tab-input');
                    if (label) {
                        label.focus();
                        document.execCommand('selectAll', false, null);
                    }
                }
            }, 100);
        };

        async function initAuth() {
            try {
                await signInAnonymously(auth);
                render();
            } catch (error) {
                console.error("Auth error:", error);
                render(); 
            }
        }

        initAuth();
    </script>
</body>
</html>
