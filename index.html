<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAVID MÉDICAL - Suivi de Projet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            color: #1e293b;
            background-color: #f8fafc;
        }

        .premium-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            border-radius: 2.5rem;
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .nav-tab {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            padding: 0.75rem 1.25rem;
            border-radius: 1rem;
        }

        .nav-tab.active {
            background-color: #4f46e5;
            color: white;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.3);
        }

        .modern-notif {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .notif-pulse {
            position: absolute;
            top: -2px;
            right: -2px;
            background: #ef4444; /* Rouge restauré pour l'alerte */
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
            animation: pulse-ring-red 2s infinite;
        }

        @keyframes pulse-ring-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .btn-modern-add {
            background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .btn-modern-add:hover {
            filter: brightness(1.05);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -10px rgba(79, 70, 229, 0.5);
        }

        .category-card {
            background: #ffffff;
            border-radius: 1.75rem;
            border: 1px solid rgba(226, 232, 240, 0.6);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .category-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.08);
            border-color: rgba(79, 70, 229, 0.2);
        }

        /* Dashboard Styles */
        .timeline-scroll {
            display: flex;
            overflow-x: auto;
            gap: 1.5rem;
            padding-bottom: 1rem;
            scrollbar-width: none;
        }
        .timeline-scroll::-webkit-scrollbar { display: none; }

        .timeline-item {
            min-width: 280px;
            background: white;
            border: 1px solid #f1f5f9;
            padding: 1.25rem;
            border-radius: 1.25rem;
            position: relative;
            transition: all 0.3s ease;
        }
        .timeline-item:hover {
            border-color: #4f46e5;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.1);
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #f1f5f9;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #4f46e5, #06b6d4);
            transition: width 0.8s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .task-item {
            border-radius: 1rem;
            padding: 1rem;
            background: #fcfdfe;
            border: 1px solid #f1f5f9;
            transition: all 0.25s ease;
        }

        .task-item:hover {
            background: #ffffff;
            border-color: #4f46e533;
            transform: scale(1.01);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        .task-done {
            opacity: 0.6;
            background-color: #f8fafc;
            filter: grayscale(0.5);
        }

        .status-badge {
            cursor: pointer;
            font-size: 10px;
            font-weight: 700;
            padding: 0.5rem 0.8rem;
            border-radius: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            transition: all 0.2s ease;
        }

        .date-container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: #f1f5f9;
            padding: 0.35rem 0.75rem;
            border-radius: 0.6rem;
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
        }

        .saas-delete-btn {
            color: #94a3b8;
            transition: all 0.2s ease;
            padding: 6px;
            border-radius: 8px;
        }

        .saas-delete-btn:hover {
            color: #4f46e5;
            background-color: #eef2ff;
        }

        #confirm-modal, #notif-modal, #late-info-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(12px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-card {
            background: white;
            padding: 2.5rem;
            border-radius: 2rem;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.25);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-card {
            animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="app" class="max-w-6xl mx-auto">
        
        <header class="premium-header text-white p-16 md:p-20 mb-10 shadow-2xl relative overflow-hidden text-center">
            <div class="absolute top-0 left-0 w-full h-full opacity-5 bg-[linear-gradient(to_right,#80808012_1px,transparent_1px),linear-gradient(to_bottom,#80808012_1px,transparent_1px)] [background-size:32px_32px]"></div>
            
            <div class="absolute top-8 right-8 z-20">
                <button id="notif-bell" class="modern-notif p-3.5 rounded-2xl relative">
                    <i data-lucide="bell" class="w-5 h-5 text-slate-300"></i>
                    <!-- Le badge repasse en rouge -->
                    <span id="notif-badge" class="notif-pulse w-4 h-4 rounded-full flex items-center justify-center text-[8px] font-black text-white hidden">0</span>
                </button>
            </div>

            <div class="relative z-10">
                <h1 class="text-6xl md:text-7xl font-black tracking-tighter uppercase mb-0 drop-shadow-2xl">DAVID MEDICAL</h1>
                <p class="text-indigo-300 text-xs font-bold tracking-[0.5em] mt-4 opacity-80">SUIVI DE DÉPLOIEMENT MÉDICAL</p>
            </div>
        </header>

        <div class="glass-nav flex items-center gap-2 mb-8 p-3 rounded-3xl sticky top-4 z-50 shadow-xl shadow-slate-200/40">
            <nav id="tabs-container" class="flex items-center gap-1 overflow-x-auto flex-grow px-1">
                <!-- Tabs generated here -->
            </nav>
            <button id="add-tab-btn" class="btn-modern-add flex items-center gap-2 px-6 py-3.5 text-white font-bold text-[10px] uppercase tracking-widest rounded-2xl active:scale-95">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Nouveau Projet</span>
            </button>
        </div>

        <main id="main-content" class="min-h-[600px]">
        </main>
        
    </div>

    <!-- Modals -->
    <div id="notif-modal">
        <div class="modal-card">
            <div class="flex items-center justify-between mb-8">
                <h3 class="text-2xl font-black text-slate-900 flex items-center gap-3">
                    <i data-lucide="bell" class="w-6 h-6 text-indigo-500"></i> Alertes
                </h3>
                <button id="close-notif-btn" class="p-2 hover:bg-slate-100 rounded-xl transition-colors"><i data-lucide="x" class="w-5 h-5 text-slate-400"></i></button>
            </div>
            <div id="notif-list" class="flex flex-col gap-3 max-h-[400px] overflow-y-auto pr-1"></div>
            <button id="dismiss-notif-btn" class="w-full mt-8 py-4 bg-slate-900 text-white font-bold rounded-2xl text-sm transition-all hover:bg-slate-800">Fermer</button>
        </div>
    </div>

    <!-- Modal retard info -->
    <div id="late-info-modal">
        <div class="modal-card text-center">
            <div class="w-16 h-16 bg-red-50 text-red-500 rounded-3xl flex items-center justify-center mb-6 mx-auto"><i data-lucide="alert-octagon" class="w-8 h-8"></i></div>
            <h3 class="text-2xl font-black text-slate-900 mb-2">Retard Détecté</h3>
            <p id="late-info-text" class="text-slate-500 text-sm mb-8 leading-relaxed px-4"></p>
            <button onclick="document.getElementById('late-info-modal').style.display='none'" class="w-full py-4 bg-red-600 text-white font-bold rounded-2xl text-sm shadow-lg shadow-red-200">J'ai compris</button>
        </div>
    </div>

    <div id="confirm-modal">
        <div class="modal-card text-center">
            <div class="w-16 h-16 bg-slate-50 text-slate-500 rounded-3xl flex items-center justify-center mb-6 mx-auto"><i data-lucide="trash-2" class="w-8 h-8"></i></div>
            <h3 class="text-2xl font-black text-slate-900 mb-2">Supprimer ?</h3>
            <p id="confirm-desc" class="text-slate-500 text-sm mb-8">Cette action est définitive.</p>
            <div class="flex gap-4">
                <button id="confirm-delete-btn" class="flex-1 py-4 bg-slate-900 text-white font-bold rounded-2xl text-sm hover:bg-slate-800 transition-all">Supprimer</button>
                <button id="cancel-delete-btn" class="flex-1 py-4 bg-slate-100 text-slate-600 font-bold rounded-2xl text-sm hover:bg-slate-200 transition-all">Annuler</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyBC0gg7v8KQltQskGo6PUaFq_megSwlixQ", authDomain: "capdavid-5cb65.firebaseapp.com", projectId: "capdavid-5cb65" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        const STATES = {
            'todo': { label: 'À faire', bg: 'bg-slate-100', text: 'text-slate-500' },
            'in-progress': { label: 'En cours', bg: 'bg-indigo-50', text: 'text-indigo-600' },
            'done': { label: 'Terminée', bg: 'bg-emerald-50', text: 'text-emerald-600' }
        };

        let tabs = [
            { id: 'dashboard', title: 'Dashboard', isDashboard: true, categories: [] },
            { id: 'tab1', title: 'Clinique Pasteur', isDashboard: false, categories: [
                { id: 'cat1', title: 'Logistique & Matériel', tasks: [
                    { id: 't1', text: 'Réception des moniteurs', status: 'done', date: '2024-03-20' },
                    { id: 't2', text: 'Installation câblage salle A1', status: 'in-progress', date: '2025-05-28' },
                    { id: 't3', text: 'Test connectivité centrale', status: 'todo', date: '2024-01-15' }
                ]}
            ]},
            { id: 'tab2', title: 'Hôpital Saint-Roch', isDashboard: false, categories: [
                { id: 'cat2', title: 'Formation', tasks: [
                    { id: 't4', text: 'Session infirmiers Bloc', status: 'todo', date: '2025-06-10' },
                    { id: 't5', text: 'Guide utilisateur PDF', status: 'done', date: '2024-02-15' }
                ]}
            ]}
        ];
        
        let activeTabId = 'dashboard';
        let pendingDeleteAction = null;

        const container = document.getElementById('tabs-container');
        const contentArea = document.getElementById('main-content');

        function formatDateFR(dateStr) {
            if (!dateStr) return '---';
            const parts = dateStr.split('-');
            if (parts.length !== 3) return dateStr;
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
        
        function isLate(dateStr, status) {
            if (!dateStr || status === 'done') return false;
            const today = new Date().toISOString().split('T')[0];
            return dateStr < today;
        }

        function render() {
            renderTabs();
            renderContent();
            updateNotifications();
            if (window.lucide) window.lucide.createIcons();
        }

        function renderTabs() {
            container.innerHTML = '';
            tabs.forEach(tab => {
                const isActive = tab.id === activeTabId;
                const tabEl = document.createElement('div');
                tabEl.className = `nav-tab cursor-pointer text-[10px] font-bold uppercase tracking-widest flex items-center ${isActive ? 'active' : 'text-slate-400 hover:text-slate-600'}`;
                tabEl.innerHTML = `<span>${tab.title}</span>`;
                if (!tab.isDashboard) {
                    const del = document.createElement('button');
                    del.className = 'saas-delete-btn ml-2';
                    del.innerHTML = '<i data-lucide="x" class="w-3 h-3"></i>';
                    del.onclick = (e) => { 
                        e.stopPropagation(); 
                        pendingDeleteAction = () => { tabs = tabs.filter(t => t.id !== tab.id); if(activeTabId === tab.id) activeTabId = 'dashboard'; render(); }; 
                        document.getElementById('confirm-desc').innerText = `Supprimer le projet "${tab.title}" ?`;
                        document.getElementById('confirm-modal').style.display='flex'; 
                    };
                    tabEl.appendChild(del);
                }
                tabEl.onclick = () => { activeTabId = tab.id; render(); };
                container.appendChild(tabEl);
            });
        }

        function renderContent() {
            const activeTab = tabs.find(t => t.id === activeTabId);
            if (!activeTab) return;

            if (activeTab.isDashboard) {
                renderDashboard();
                return;
            }

            contentArea.innerHTML = `
                <div class="flex flex-col gap-12">
                    <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 px-4">
                        <div class="flex flex-col gap-2">
                             <p class="text-[10px] font-black text-indigo-500 uppercase tracking-[0.3em]">PROJET ACTIF</p>
                             <input type="text" value="${activeTab.title}" class="font-black text-slate-900 text-5xl outline-none w-full bg-transparent focus:text-indigo-600 transition-colors tracking-tight" onblur="window.updateTabTitle('${activeTab.id}', this.value)">
                        </div>
                        <button onclick="window.addCategory()" class="shrink-0 px-10 py-5 bg-slate-900 text-white rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-slate-800 transition-all shadow-2xl active:scale-95">Ajouter une section</button>
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                        ${activeTab.categories.map((cat, idx) => `
                            <div class="category-card p-10 flex flex-col gap-8 animate-card" style="animation-delay: ${idx * 0.1}s">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 bg-indigo-50 text-indigo-500 rounded-xl flex items-center justify-center">
                                            <i data-lucide="layout" class="w-5 h-5"></i>
                                        </div>
                                        <input type="text" value="${cat.title}" class="font-black text-slate-800 text-2xl outline-none bg-transparent" onblur="window.updateCategoryTitle('${cat.id}', this.value)">
                                    </div>
                                    <button onclick="window.confirmDeleteCategory('${cat.id}', '${cat.title.replace(/'/g, "\\'")}')" class="saas-delete-btn"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                                </div>
                                <div class="flex flex-col gap-5">
                                    ${cat.tasks.map(task => `
                                        <div class="task-item flex items-center justify-between gap-4 ${task.status === 'done' ? 'task-done' : ''}">
                                            <div class="flex flex-col gap-2 flex-grow">
                                                <input type="text" value="${task.text}" class="text-sm font-extrabold text-slate-700 outline-none bg-transparent" onblur="window.updateTaskText('${cat.id}', '${task.id}', this.value)">
                                                <div class="date-container w-fit ${isLate(task.date, task.status) ? 'bg-red-50 text-red-600' : ''}">
                                                    <i data-lucide="calendar" class="w-3 h-3"></i>
                                                    <span>${formatDateFR(task.date)}</span>
                                                    <input type="date" value="${task.date || ''}" class="absolute inset-0 opacity-0 cursor-pointer" onchange="window.updateTaskDate('${cat.id}', '${task.id}', this.value)">
                                                </div>
                                            </div>
                                            <div class="flex items-center gap-4">
                                                <div onclick="window.cycleStatus('${cat.id}', '${task.id}')" class="status-badge ${STATES[task.status].bg} ${STATES[task.status].text}">${STATES[task.status].label}</div>
                                                <button onclick="window.confirmDeleteTask('${cat.id}', '${task.id}', '${task.text.replace(/'/g, "\\'")}')" class="saas-delete-btn"><i data-lucide="x" class="w-4 h-4"></i></button>
                                            </div>
                                        </div>
                                    `).join('')}
                                    <input type="text" placeholder="+ Tâche..." class="w-full bg-slate-50/50 px-6 py-5 rounded-2xl text-[11px] font-black uppercase tracking-widest outline-none border-2 border-dashed border-slate-100 focus:border-indigo-500 transition-all" onkeydown="if(event.key === 'Enter' && this.value.trim()) { window.addTask('${cat.id}', this.value); this.value=''; }">
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderDashboard() {
            let allTasks = [];
            tabs.forEach(tab => {
                if(tab.isDashboard) return;
                tab.categories.forEach(cat => {
                    cat.tasks.forEach(task => {
                        allTasks.push({ ...task, projectTitle: tab.title, projectId: tab.id });
                    });
                });
            });

            allTasks = allTasks.filter(t => t.date).sort((a, b) => a.date.localeCompare(b.date));

            contentArea.innerHTML = `
                <div class="flex flex-col gap-12">
                    <!-- FRESQUE CHRONOLOGIQUE -->
                    <section class="animate-card">
                        <div class="flex items-center justify-between mb-6 px-4">
                            <h3 class="text-[10px] font-black text-indigo-500 uppercase tracking-[0.3em]">Fresque Chronologique</h3>
                            <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${allTasks.length} Tâches planifiées</div>
                        </div>
                        <div class="timeline-scroll p-4">
                            ${allTasks.length === 0 ? `
                                <div class="w-full text-center py-10 bg-slate-50 rounded-3xl border-2 border-dashed border-slate-200">
                                    <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest">Aucune tâche planifiée</p>
                                </div>
                            ` : allTasks.map(task => {
                                const late = isLate(task.date, task.status);
                                return `
                                    <div class="timeline-item flex flex-col gap-3 group border-l-4 ${late ? 'border-l-red-500' : 'border-l-transparent'}">
                                        <div class="flex items-center justify-between">
                                            <span class="text-[9px] font-black uppercase text-slate-400 group-hover:text-indigo-500 transition-colors">${task.projectTitle}</span>
                                            <!-- Point d'alerte rouge restauré -->
                                            ${late ? '<span class="flex h-2 w-2 rounded-full bg-red-500 animate-pulse"></span>' : ''}
                                        </div>
                                        <div class="text-sm font-bold text-slate-800 line-clamp-1">${task.text}</div>
                                        <div class="flex items-center justify-between mt-2">
                                            <div class="flex items-center gap-1.5 ${late ? 'text-red-500' : 'text-slate-500'}">
                                                <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                                                <span class="text-[10px] font-bold">${formatDateFR(task.date)}</span>
                                            </div>
                                            <div class="text-[9px] font-black px-2 py-1 rounded bg-slate-100 text-slate-500 uppercase">${STATES[task.status].label}</div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </section>

                    <!-- GRILLE DES PROJETS -->
                    <section>
                         <h3 class="text-[10px] font-black text-indigo-500 uppercase tracking-[0.3em] mb-8 px-4">État d'avancement des projets</h3>
                         <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            ${tabs.filter(t => !t.isDashboard).map((tab, idx) => {
                                let total = 0, done = 0;
                                tab.categories.forEach(c => {
                                    total += c.tasks.length;
                                    done += c.tasks.filter(tk => tk.status === 'done').length;
                                });
                                const percent = total === 0 ? 0 : Math.round((done / total) * 100);
                                
                                return `
                                    <div class="category-card p-8 flex flex-col gap-6 animate-card hover:cursor-pointer" style="animation-delay: ${idx * 0.1}s" onclick="window.setActiveTab('${tab.id}')">
                                        <div class="flex items-start justify-between">
                                            <div class="flex flex-col gap-1">
                                                <h4 class="text-xl font-black text-slate-900 tracking-tight">${tab.title}</h4>
                                                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${total} Tâches au total</p>
                                            </div>
                                            <div class="w-12 h-12 rounded-2xl bg-indigo-50 flex items-center justify-center text-indigo-500 font-black text-xs">
                                                ${percent}%
                                            </div>
                                        </div>

                                        <div class="flex flex-col gap-2">
                                            <div class="flex justify-between text-[9px] font-black uppercase tracking-widest text-slate-500">
                                                <span>Progression</span>
                                                <span>${done}/${total}</span>
                                            </div>
                                            <div class="progress-bar-container">
                                                <div class="progress-bar-fill" style="width: ${percent}%"></div>
                                            </div>
                                        </div>

                                        <div class="pt-4 mt-2 border-t border-slate-50 flex items-center justify-between">
                                            <div class="flex -space-x-2">
                                                ${tab.categories.slice(0, 3).map(() => `<div class="w-7 h-7 rounded-full bg-slate-100 border-2 border-white"></div>`).join('')}
                                            </div>
                                            <span class="text-[9px] font-black uppercase text-indigo-500 tracking-widest group-hover:underline">Ouvrir le projet <i data-lucide="arrow-right" class="inline w-3 h-3 ml-1"></i></span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                         </div>
                    </section>
                </div>
            `;
            if (window.lucide) window.lucide.createIcons();
        }

        // Actions
        window.setActiveTab = (id) => { activeTabId = id; render(); };
        window.updateTabTitle = (id, v) => { const t = tabs.find(x => x.id === id); if(t) t.title = v; renderTabs(); };
        window.addCategory = () => { const activeTab = tabs.find(t => t.id === activeTabId); activeTab.categories.push({ id: 'cat' + Date.now(), title: 'Nouvelle Section', tasks: [] }); render(); };
        window.updateCategoryTitle = (catId, newTitle) => { const activeTab = tabs.find(t => t.id === activeTabId); const cat = activeTab.categories.find(c => c.id === catId); if (cat) cat.title = newTitle; };
        window.confirmDeleteCategory = (catId, catTitle) => { 
            pendingDeleteAction = () => { const activeTab = tabs.find(t => t.id === activeTabId); activeTab.categories = activeTab.categories.filter(c => c.id !== catId); }; 
            document.getElementById('confirm-desc').innerText = `Supprimer la section "${catTitle}" ?`;
            document.getElementById('confirm-modal').style.display='flex'; 
        };
        window.confirmDeleteTask = (catId, taskId, taskText) => {
            pendingDeleteAction = () => { const activeTab = tabs.find(t => t.id === activeTabId); const cat = activeTab.categories.find(c => c.id === catId); cat.tasks = cat.tasks.filter(tk => tk.id !== taskId); };
            document.getElementById('confirm-desc').innerText = `Supprimer "${taskText}" ?`;
            document.getElementById('confirm-modal').style.display='flex';
        };
        window.addTask = (catId, text) => { const activeTab = tabs.find(t => t.id === activeTabId); const cat = activeTab.categories.find(c => c.id === catId); cat.tasks.push({ id: 'task' + Date.now(), text, status: 'todo', date: new Date().toISOString().split('T')[0] }); render(); };
        window.updateTaskText = (cid, tid, text) => { const cat = tabs.find(t => t.id === activeTabId).categories.find(c => c.id === cid); const task = cat.tasks.find(tk => tk.id === tid); task.text = text; };
        window.updateTaskDate = (cid, tid, date) => { const cat = tabs.find(t => t.id === activeTabId).categories.find(c => c.id === cid); const task = cat.tasks.find(tk => tk.id === tid); task.date = date; render(); };
        window.cycleStatus = (cid, tid) => { const cat = tabs.find(t => t.id === activeTabId).categories.find(c => c.id === cid); const task = cat.tasks.find(tk => tk.id === tid); const order = ['todo', 'in-progress', 'done']; task.status = order[(order.indexOf(task.status) + 1) % 3]; render(); };

        function updateNotifications() {
            const today = new Date().toISOString().split('T')[0];
            const lateTasks = [];
            tabs.forEach(tab => {
                if (tab.isDashboard) return;
                tab.categories.forEach(cat => {
                    cat.tasks.forEach(task => {
                        if (task.status !== 'done' && task.date && task.date < today) {
                            lateTasks.push({ ...task, tabTitle: tab.title });
                        }
                    });
                });
            });
            const badge = document.getElementById('notif-badge');
            if (lateTasks.length > 0) {
                badge.innerText = lateTasks.length;
                badge.classList.remove('hidden');
                document.getElementById('notif-list').innerHTML = lateTasks.map(task => `
                    <div class="p-4 bg-red-50 border border-red-100 rounded-2xl">
                        <div class="text-[9px] font-black uppercase text-red-400">${task.tabTitle}</div>
                        <div class="text-sm font-bold text-slate-800">${task.text}</div>
                        <div class="text-[10px] text-red-600 font-bold mt-1">RETARD : Échéance au ${formatDateFR(task.date)}</div>
                    </div>
                `).join('');
            } else {
                badge.classList.add('hidden');
                document.getElementById('notif-list').innerHTML = '<div class="text-center py-10 text-slate-300 text-xs font-bold uppercase">Aucune alerte</div>';
            }
        }

        document.getElementById('confirm-delete-btn').onclick = () => { if(pendingDeleteAction) pendingDeleteAction(); document.getElementById('confirm-modal').style.display='none'; render(); };
        document.getElementById('cancel-delete-btn').onclick = () => { pendingDeleteAction = null; document.getElementById('confirm-modal').style.display='none'; };
        document.getElementById('notif-bell').onclick = () => { document.getElementById('notif-modal').style.display='flex'; if(window.lucide) window.lucide.createIcons(); };
        document.getElementById('close-notif-btn').onclick = document.getElementById('dismiss-notif-btn').onclick = () => document.getElementById('notif-modal').style.display='none';
        document.getElementById('add-tab-btn').onclick = () => { const id = 'tab' + Date.now(); tabs.push({ id, title: 'Nouveau Projet', isDashboard: false, categories: [] }); activeTabId = id; render(); };

        async function initAuth() { try { await signInAnonymously(auth); render(); } catch (e) { render(); } }
        initAuth();
    </script>
</body>
</html>
