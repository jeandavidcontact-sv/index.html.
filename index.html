<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAVID MÉDICAL - Suivi de Projet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            color: #1e293b;
        }

        .premium-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border-radius: 2.5rem;
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .nav-tab {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .nav-tab.active {
            background-color: white;
            color: #4f46e5;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .nav-tab:not(.active):hover {
            background-color: rgba(241, 245, 249, 0.8);
            color: #334155;
        }

        /* Nouveau style pour le bouton corbeille */
        .saas-delete-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #cbd5e1;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .saas-delete-btn:hover {
            color: #ef4444;
            transform: scale(1.1);
        }

        .category-card {
            background: white;
            border-radius: 2rem;
            border: 1px solid #f1f5f9;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.04);
            transition: all 0.3s ease;
        }

        /* Style de la tâche inspiré de la photo */
        .task-item {
            border-radius: 1.5rem;
            padding: 1.25rem 1.5rem;
            transition: all 0.3s ease;
            border: 1px solid #f8fafc;
            background: #fbfcfd;
        }

        .task-item.status-in-progress {
            background: #fffafa;
            border-color: #fee2e2;
        }

        .task-done {
            opacity: 0.6;
            background-color: #f8fafc;
        }

        .status-badge {
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            font-size: 10px;
            font-weight: 800;
            padding: 0.6rem 1.2rem;
            border-radius: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .status-badge:active {
            transform: scale(0.95);
        }

        .tab-input:focus {
            outline: none;
            background: #f8fafc;
            padding: 2px 6px;
            border-radius: 6px;
        }

        input[type="date"] {
            color-scheme: light;
            border: none;
            background: transparent;
            cursor: pointer;
        }

        /* Modale */
        #confirm-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-card {
            background: white;
            padding: 2.5rem;
            border-radius: 2.5rem;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }

        #tabs-container::-webkit-scrollbar { display: none; }
        #tabs-container { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#f4f7f9] min-h-screen p-4 md:p-10">

    <div id="app" class="max-w-7xl mx-auto">
        
        <header class="premium-header text-white p-14 md:p-20 mb-10 shadow-2xl relative overflow-hidden flex items-center justify-center">
            <div class="absolute inset-0 bg-indigo-500/10 blur-3xl rounded-full transform scale-150 translate-y-1/2"></div>
            <div class="relative z-10 text-center">
                <h1 class="text-6xl md:text-8xl font-extrabold tracking-tighter uppercase mb-2">DAVID MÉDICAL</h1>
                <p class="text-indigo-300 font-medium tracking-widest uppercase text-sm opacity-80">Gestion de Projets & Tâches</p>
            </div>
        </header>

        <div class="glass-nav flex items-center gap-3 mb-10 p-2.5 rounded-3xl shadow-sm sticky top-6 z-50">
            <nav id="tabs-container" class="flex items-center gap-2 overflow-x-auto flex-grow px-2">
                <!-- Onglets injectés ici -->
            </nav>
            <button id="add-tab-btn" class="flex items-center gap-2 px-5 py-2.5 text-white bg-indigo-600 hover:bg-indigo-700 font-semibold text-xs uppercase tracking-widest rounded-2xl transition-all shadow-md active:scale-95">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Nouveau Projet</span>
            </button>
        </div>

        <main id="main-content" class="bg-white p-8 md:p-12 rounded-[3.5rem] shadow-sm border border-slate-100 min-h-[500px]">
            <!-- Contenu dynamique -->
        </main>
        
    </div>

    <!-- Modale de Confirmation -->
    <div id="confirm-modal">
        <div class="modal-card">
            <div class="w-16 h-16 bg-rose-50 text-rose-500 rounded-2xl flex items-center justify-center mb-6 mx-auto">
                <i data-lucide="trash-2" class="w-8 h-8"></i>
            </div>
            <h3 class="text-xl font-extrabold text-slate-900 text-center mb-2">Supprimer cet élément ?</h3>
            <p class="text-slate-500 text-center text-sm mb-8">Cette action effacera définitivement les données sélectionnées.</p>
            <div class="flex flex-col gap-3">
                <button id="confirm-delete-btn" class="w-full py-4 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-2xl transition-all shadow-lg shadow-rose-100 active:scale-95">
                    Confirmer la suppression
                </button>
                <button id="cancel-delete-btn" class="w-full py-4 bg-slate-50 hover:bg-slate-100 text-slate-600 font-bold rounded-2xl transition-all active:scale-95">
                    Annuler
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBC0gg7v8KQltQskGo6PUaFq_megSwlixQ",
            authDomain: "capdavid-5cb65.firebaseapp.com",
            projectId: "capdavid-5cb65",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        const STATES = {
            'todo': { label: 'À faire', bg: 'bg-slate-100', text: 'text-slate-600' },
            'in-progress': { label: 'En cours', bg: 'bg-blue-100', text: 'text-blue-700' },
            'done': { label: 'Terminée', bg: 'bg-emerald-100', text: 'text-emerald-700' }
        };

        let tabs = [
            { 
                id: 'dashboard', 
                title: 'Tableau de bord', 
                isDashboard: true,
                categories: [] 
            },
            { 
                id: 'tab2', 
                title: 'Projets Clients', 
                isDashboard: false,
                categories: [
                    {
                        id: 'cat1',
                        title: 'Installation',
                        tasks: [
                            { id: 't1', text: 'Choix du local', status: 'done', date: '2024-01-15' },
                            { id: 't2', text: 'Achat mobilier bureau', status: 'in-progress', date: '2024-03-20' }
                        ]
                    }
                ] 
            }
        ];
        
        let activeTabId = 'dashboard';
        let pendingDeleteAction = null;

        const container = document.getElementById('tabs-container');
        const contentArea = document.getElementById('main-content');
        const addBtn = document.getElementById('add-tab-btn');
        const confirmModal = document.getElementById('confirm-modal');
        const confirmBtn = document.getElementById('confirm-delete-btn');
        const cancelBtn = document.getElementById('cancel-delete-btn');

        function render() {
            renderTabs();
            renderContent();
            if (window.lucide) window.lucide.createIcons();
        }

        function requestConfirmation(action) {
            pendingDeleteAction = action;
            confirmModal.style.display = 'flex';
        }

        confirmBtn.onclick = () => {
            if (pendingDeleteAction) {
                pendingDeleteAction();
                pendingDeleteAction = null;
            }
            confirmModal.style.display = 'none';
        };

        cancelBtn.onclick = () => {
            pendingDeleteAction = null;
            confirmModal.style.display = 'none';
        };

        function renderTabs() {
            container.innerHTML = '';
            tabs.forEach(tab => {
                const isActive = tab.id === activeTabId;
                const tabEl = document.createElement('div');
                tabEl.className = `nav-tab flex items-center gap-2 px-4 py-2.5 rounded-2xl cursor-pointer font-semibold text-[11px] uppercase tracking-widest ${isActive ? 'active' : 'text-slate-500'}`;
                
                const label = document.createElement('span');
                label.className = 'tab-input outline-none whitespace-nowrap';
                label.contentEditable = isActive && !tab.isDashboard; 
                label.innerText = tab.title;
                
                label.onblur = () => {
                    if(!tab.isDashboard) {
                        tab.title = label.innerText.trim() || "Sans titre";
                        render();
                    }
                };

                label.onkeydown = (e) => { if(e.key === 'Enter') { e.preventDefault(); label.blur(); } };
                tabEl.appendChild(label);

                if (!tab.isDashboard) {
                    const del = document.createElement('button');
                    del.className = 'saas-delete-btn ml-2';
                    del.innerHTML = '<i data-lucide="trash-2" class="w-3.5 h-3.5"></i>';
                    del.onclick = (e) => { 
                        e.stopPropagation(); 
                        requestConfirmation(() => deleteTab(tab.id));
                    };
                    tabEl.appendChild(del);
                }

                tabEl.onclick = () => { activeTabId = tab.id; render(); };
                container.appendChild(tabEl);
            });
        }

        function renderContent() {
            const activeTab = tabs.find(t => t.id === activeTabId);
            if (!activeTab) return;

            if (activeTab.isDashboard) {
                contentArea.innerHTML = `
                    <div class="max-w-4xl">
                        <h2 class="text-4xl font-extrabold text-slate-900 mb-6">Tableau de bord</h2>
                        <p class="text-slate-500 text-lg">Bienvenue dans votre interface de gestion centralisée.</p>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-12">
                            <div class="p-8 bg-slate-50 rounded-[2rem] border border-slate-100">
                                <div class="text-indigo-600 font-bold text-4xl mb-1">${tabs.length - 1}</div>
                                <div class="text-slate-500 uppercase text-[10px] tracking-widest font-extrabold">Projets Actifs</div>
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            contentArea.innerHTML = `
                <div class="flex flex-col gap-10">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 px-2">
                        <h2 class="text-4xl font-extrabold text-slate-900 tracking-tight">${activeTab.title}</h2>
                        <button onclick="window.addCategory()" class="inline-flex items-center justify-center gap-2 px-7 py-4 bg-indigo-600 text-white rounded-[1.2rem] text-[10px] font-bold uppercase tracking-widest hover:bg-indigo-700 transition-all shadow-xl shadow-indigo-100 active:scale-95">
                            <i data-lucide="layout-grid" class="w-4 h-4"></i> Ajouter une catégorie
                        </button>
                    </div>
                    
                    <div class="grid grid-cols-1 xl:grid-cols-2 gap-10" id="categories-grid">
                        ${activeTab.categories.map(cat => renderCategory(cat)).join('')}
                    </div>
                </div>
            `;
        }

        function getSortedTasks(tasks) {
            return [...tasks].sort((a, b) => {
                if (a.status === 'done' && b.status !== 'done') return 1;
                if (a.status !== 'done' && b.status === 'done') return -1;
                const dateA = a.date || '9999-99-99';
                const dateB = b.date || '9999-99-99';
                return dateA.localeCompare(dateB);
            });
        }

        function renderCategory(cat) {
            const sortedTasks = getSortedTasks(cat.tasks);

            return `
                <div class="category-card p-8 flex flex-col gap-8">
                    <div class="flex items-center justify-between gap-4">
                        <input type="text" value="${cat.title}" 
                            class="font-extrabold text-slate-800 text-2xl outline-none w-full bg-transparent focus:text-indigo-600"
                            onblur="window.updateCategoryTitle('${cat.id}', this.value)"
                            placeholder="Nom de la section">
                        <button onclick="window.confirmDeleteCategory('${cat.id}')" 
                                class="saas-delete-btn p-2">
                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                        </button>
                    </div>
                    
                    <div class="flex flex-col gap-4">
                        ${sortedTasks.map(task => {
                            const state = STATES[task.status] || STATES['todo'];
                            const isDone = task.status === 'done';
                            const isInProgress = task.status === 'in-progress';
                            
                            // Formatage de la date DD/MM/YYYY
                            let formattedDate = "";
                            if(task.date) {
                                const [y, m, d] = task.date.split('-');
                                formattedDate = `${d}/${m}/${y}`;
                            }

                            return `
                                <div class="task-item flex items-center justify-between gap-4 ${isDone ? 'task-done' : ''} ${isInProgress ? 'status-in-progress' : ''}">
                                    <div class="flex flex-col gap-1.5 flex-grow">
                                        <input type="text" value="${task.text}" 
                                            class="text-[17px] font-bold text-slate-800 outline-none bg-transparent ${isDone ? 'opacity-50' : ''}"
                                            onblur="window.updateTaskText('${cat.id}', '${task.id}', this.value)"
                                            placeholder="Nouvelle tâche...">
                                        
                                        <div class="flex items-center gap-2 group relative">
                                            <span class="text-[13px] font-bold ${isDone ? 'text-slate-400' : isInProgress ? 'text-rose-400' : 'text-slate-400'}">
                                                ${formattedDate || 'Définir date'}
                                            </span>
                                            <i data-lucide="calendar" class="w-3.5 h-3.5 text-slate-400"></i>
                                            <input type="date" value="${task.date || ''}"
                                                class="absolute inset-0 opacity-0 w-full h-full"
                                                onchange="window.updateTaskDate('${cat.id}', '${task.id}', this.value)">
                                        </div>
                                    </div>
                                    
                                    <div class="flex items-center gap-6">
                                        <div onclick="window.cycleStatus('${cat.id}', '${task.id}')" 
                                             class="status-badge shadow-sm ${state.bg} ${state.text}">
                                            ${state.label}
                                        </div>
                                        
                                        <button onclick="window.confirmDeleteTask('${cat.id}', '${task.id}')" 
                                                class="saas-delete-btn opacity-0 group-hover:opacity-100 focus:opacity-100 transition-opacity">
                                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                                        </button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                        
                        <div class="mt-4 pt-4 border-t border-slate-50 flex items-center gap-4">
                            <input type="text" 
                                   placeholder="Nouvelle tâche..." 
                                   class="flex-grow bg-[#f8fafc] px-6 py-4 rounded-2xl text-sm font-semibold outline-none focus:ring-2 focus:ring-indigo-100 transition-all"
                                   onkeydown="if(event.key === 'Enter') { window.addTask('${cat.id}', this.value); this.value=''; }">
                            <button onclick="const input = this.previousElementSibling; if(input.value) { window.addTask('${cat.id}', input.value); input.value=''; }" 
                                    class="bg-indigo-600 text-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-200 hover:scale-105 active:scale-95 transition-all">
                                <i data-lucide="plus" class="w-6 h-6"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.confirmDeleteCategory = (catId) => {
            requestConfirmation(() => {
                const activeTab = tabs.find(t => t.id === activeTabId);
                activeTab.categories = activeTab.categories.filter(c => c.id !== catId);
                render();
            });
        };

        window.confirmDeleteTask = (catId, taskId) => {
            requestConfirmation(() => {
                const activeTab = tabs.find(t => t.id === activeTabId);
                const cat = activeTab.categories.find(c => c.id === catId);
                cat.tasks = cat.tasks.filter(t => t.id !== taskId);
                render();
            });
        };

        window.cycleStatus = (catId, taskId) => {
            const activeTab = tabs.find(t => t.id === activeTabId);
            const cat = activeTab.categories.find(c => c.id === catId);
            const task = cat.tasks.find(t => t.id === taskId);
            const statusOrder = ['todo', 'in-progress', 'done'];
            let currentIndex = statusOrder.indexOf(task.status);
            task.status = statusOrder[(currentIndex + 1) % statusOrder.length];
            render();
        };

        window.updateTaskDate = (catId, taskId, newDate) => {
            const activeTab = tabs.find(t => t.id === activeTabId);
            const cat = activeTab.categories.find(c => c.id === catId);
            const task = cat.tasks.find(t => t.id === taskId);
            task.date = newDate;
            render();
        };

        window.addCategory = () => {
            const activeTab = tabs.find(t => t.id === activeTabId);
            activeTab.categories.push({
                id: 'cat' + Date.now(),
                title: '',
                tasks: []
            });
            render();
        };

        window.updateCategoryTitle = (catId, newTitle) => {
            const activeTab = tabs.find(t => t.id === activeTabId);
            const cat = activeTab.categories.find(c => c.id === catId);
            if (cat) cat.title = newTitle;
        };

        window.addTask = (catId, text = '') => {
            const activeTab = tabs.find(t => t.id === activeTabId);
            const cat = activeTab.categories.find(c => c.id === catId);
            cat.tasks.push({
                id: 'task' + Date.now(),
                text: text,
                status: 'todo',
                date: new Date().toISOString().split('T')[0]
            });
            render();
        };

        window.updateTaskText = (catId, taskId, newText) => {
            const activeTab = tabs.find(t => t.id === activeTabId);
            const cat = activeTab.categories.find(c => c.id === catId);
            const task = cat.tasks.find(t => t.id === taskId);
            task.text = newText;
        };

        function deleteTab(id) {
            tabs = tabs.filter(t => t.id !== id);
            if (activeTabId === id) activeTabId = 'dashboard';
            render();
        }

        addBtn.onclick = () => {
            const newId = 'tab' + Date.now();
            tabs.push({ id: newId, title: 'Nouveau Projet', isDashboard: false, categories: [] });
            activeTabId = newId;
            render();
        }

        async function initAuth() {
            try { await signInAnonymously(auth); render(); } catch (e) { render(); }
        }
        initAuth();
    </script>
</body>
</html>
