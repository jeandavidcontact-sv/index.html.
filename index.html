<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAVID MÉDICAL - Suivi de Projet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        .premium-header {
            background: linear-gradient(135deg, #111827 0%, #1e293b 100%);
            border-radius: 2rem;
        }

        .nav-tab {
            transition: all 0.2s ease;
            position: relative;
        }

        .nav-tab.active {
            background-color: #f8fafc;
            color: #6366f1;
            border-bottom: 2px solid #6366f1;
        }

        /* Le crayon n'apparaît qu'au survol ou sur l'onglet actif */
        .edit-icon, .delete-btn {
            opacity: 0;
            transition: opacity 0.2s;
        }

        .nav-tab:hover .edit-icon, 
        .nav-tab:hover .delete-btn {
            opacity: 1;
        }

        .tab-input:focus {
            outline: none;
            background: #f1f5f9;
            padding: 2px 4px;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">

    <div id="app" class="max-w-7xl mx-auto">
        
        <!-- Header Minimaliste David Médical -->
        <header class="premium-header text-white p-12 md:p-16 mb-6 shadow-2xl relative overflow-hidden flex items-center justify-center">
            <div class="absolute inset-0 bg-indigo-500/5 blur-3xl rounded-full transform scale-150"></div>
            
            <div class="relative z-10 text-center">
                <h1 class="text-5xl md:text-7xl font-extrabold tracking-tighter uppercase">
                    DAVID MÉDICAL
                </h1>
            </div>
        </header>

        <!-- Bandeau de Navigation Dynamique -->
        <div class="flex items-center gap-2 mb-8 bg-white p-2 rounded-2xl shadow-sm border border-slate-100 sticky top-4 z-50">
            <nav id="tabs-container" class="flex items-center gap-1 overflow-x-auto flex-grow px-2">
                <!-- Onglets injectés ici -->
            </nav>
            
            <!-- Bouton d'action pour ajouter un onglet -->
            <button id="add-tab-btn" class="flex items-center gap-2 px-4 py-2 text-indigo-600 hover:bg-indigo-50 font-bold text-sm uppercase tracking-wider rounded-xl transition-colors border-l border-slate-100">
                <i data-lucide="plus-circle" class="w-5 h-5"></i>
                <span class="hidden sm:inline">Ajouter</span>
            </button>
        </div>

        <!-- Zone de Contenu Dynamique -->
        <main id="main-content" class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 min-h-[400px]">
            <!-- Contenu dynamique -->
        </main>
        
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBC0gg7v8KQltQskGo6PUaFq_megSwlixQ",
            authDomain: "capdavid-5cb65.firebaseapp.com",
            databaseURL: "https://capdavid-5cb65-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "capdavid-5cb65",
            storageBucket: "capdavid-5cb65.firebasestorage.app",
            messagingSenderId: "346917679110",
            appId: "1:346917679110:web:2b76ad31621eec618ed387",
            measurementId: "G-GHTM9M5WCD"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        // --- LOGIQUE DES ONGLETS ---
        
        let tabs = [
            { id: 'tab1', title: 'Tableau de bord', content: 'Ceci est votre tableau de bord principal.' },
            { id: 'tab2', title: 'Projets', content: 'Liste de vos projets médicaux en cours.' }
        ];
        let activeTabId = 'tab1';

        const container = document.getElementById('tabs-container');
        const contentArea = document.getElementById('main-content');
        const addBtn = document.getElementById('add-tab-btn');

        function render() {
            container.innerHTML = '';
            tabs.forEach(tab => {
                const isActive = tab.id === activeTabId;
                const tabEl = document.createElement('div');
                tabEl.className = `nav-tab flex items-center gap-2 px-4 py-2 rounded-xl cursor-pointer font-bold text-sm uppercase tracking-wider ${isActive ? 'active' : 'text-slate-400 hover:bg-slate-50'}`;
                
                // Texte de l'onglet (éditable via clic sur le texte si actif)
                const label = document.createElement('span');
                label.className = 'tab-input outline-none';
                label.contentEditable = isActive; 
                label.innerText = tab.title;
                
                // Gestion de l'édition
                label.onclick = (e) => { 
                    if(isActive) e.stopPropagation(); 
                };
                
                label.onblur = () => {
                    tab.title = label.innerText.trim() || "Sans titre";
                    render();
                };

                label.onkeydown = (e) => {
                    if(e.key === 'Enter') { 
                        e.preventDefault(); 
                        label.blur(); 
                    }
                };

                tabEl.appendChild(label);

                // Icône crayon si actif pour indiquer l'édition possible
                if(isActive) {
                    const pen = document.createElement('i');
                    pen.setAttribute('data-lucide', 'pencil');
                    pen.className = 'w-3 h-3 text-indigo-400 edit-icon ml-1';
                    tabEl.appendChild(pen);
                }

                // Bouton supprimer (si plus d'un onglet)
                if (tabs.length > 1) {
                    const del = document.createElement('button');
                    del.className = 'delete-btn text-slate-300 hover:text-rose-500 ml-1 flex items-center';
                    del.innerHTML = '<i data-lucide="x" class="w-4 h-4"></i>';
                    del.onclick = (e) => {
                        e.stopPropagation();
                        deleteTab(tab.id);
                    };
                    tabEl.appendChild(del);
                }

                // Changement d'onglet
                tabEl.onclick = () => {
                    activeTabId = tab.id;
                    render();
                };

                container.appendChild(tabEl);
            });

            // Mise à jour du contenu principal
            const activeTab = tabs.find(t => t.id === activeTabId);
            if (activeTab) {
                contentArea.innerHTML = `
                    <h2 class="text-3xl font-extrabold text-slate-800 mb-4">${activeTab.title}</h2>
                    <div class="text-slate-500 leading-relaxed">${activeTab.content}</div>
                `;
            }

            // Ré-initialisation des icônes Lucide
            if (window.lucide) window.lucide.createIcons();
        }

        function deleteTab(id) {
            tabs = tabs.filter(t => t.id !== id);
            if (activeTabId === id) activeTabId = tabs[0].id;
            render();
        }

        // Action du bouton "Ajouter"
        addBtn.onclick = () => {
            const newId = 'tab' + Date.now();
            tabs.push({
                id: newId,
                title: 'Nouvel onglet',
                content: 'Contenu de la nouvelle page. Vous pouvez modifier le titre directement dans le bandeau.'
            });
            activeTabId = newId;
            render();
            
            // Focus automatique sur le nouveau titre pour édition rapide
            setTimeout(() => {
                const lastTab = container.lastElementChild;
                if (lastTab) {
                    const label = lastTab.querySelector('.tab-input');
                    if (label) {
                        label.focus();
                        // Sélectionner tout le texte pour faciliter le renommage
                        document.execCommand('selectAll', false, null);
                    }
                }
            }, 100);
        };

        async function initAuth() {
            try {
                await signInAnonymously(auth);
                render();
            } catch (error) {
                console.error("Auth error:", error);
                render(); // Fallback si hors ligne
            }
        }

        initAuth();
    </script>
</body>
</html>
