<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAVID MÉDICAL - Suivi de Projet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .premium-header {
            background: linear-gradient(135deg, #111827 0%, #1e293b 100%);
            border-radius: 2rem;
        }

        .task-card { 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        
        .task-card:hover { 
            transform: translateY(-4px); 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); 
        }

        .stat-card {
            transition: all 0.2s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: #e2e8f0;
        }

        .stat-card.active {
            border-color: #6366f1;
            background-color: #f8faff;
        }

        /* Scrollbar subtile pour les colonnes */
        .kanban-column-content::-webkit-scrollbar {
            width: 4px;
        }
        .kanban-column-content::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div id="app" class="max-w-7xl mx-auto p-4 md:p-8">
        
        <!-- HEADER PERSISTANT -->
        <header class="premium-header text-white p-8 md:p-12 mb-8 shadow-2xl relative overflow-hidden flex items-center justify-center cursor-pointer" id="header-home">
            <div class="absolute inset-0 bg-indigo-500/5 blur-3xl rounded-full transform scale-150"></div>
            <div class="relative z-10 text-center">
                <h1 class="text-4xl md:text-6xl font-extrabold tracking-tighter uppercase">
                    DAVID MÉDICAL
                </h1>
            </div>
        </header>

        <!-- STATISTIQUES PERSISTANTES (ONGLETS) -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="stat-card bg-white p-4 rounded-2xl shadow-sm border border-slate-100 active" data-page="home" id="tab-home">
                <p class="text-xs text-slate-500 font-semibold uppercase tracking-wider mb-1">Tableau de bord</p>
                <h3 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Vue
                </h3>
            </div>
            <div class="stat-card bg-white p-4 rounded-2xl shadow-sm border border-slate-100" data-page="encours">
                <p class="text-xs text-slate-500 font-semibold uppercase tracking-wider mb-1">En cours</p>
                <h3 id="doing-count-stat" class="text-2xl font-bold text-amber-500">0</h3>
            </div>
            <div class="stat-card bg-white p-4 rounded-2xl shadow-sm border border-slate-100" data-page="terminees">
                <p class="text-xs text-slate-500 font-semibold uppercase tracking-wider mb-1">Terminées</p>
                <h3 id="completed-tasks-count" class="text-2xl font-bold text-emerald-500">0</h3>
            </div>
            <div class="stat-card bg-white p-4 rounded-2xl shadow-sm border border-slate-100" data-page="progression">
                <p class="text-xs text-slate-500 font-semibold uppercase tracking-wider mb-1">Progression</p>
                <h3 id="progress-percent" class="text-2xl font-bold text-indigo-600">0%</h3>
            </div>
        </div>

        <!-- ZONE DE CONTENU DYNAMIQUE -->
        <main id="content-area">
            
            <!-- VUE : TABLEAU KANBAN (HOME) -->
            <div id="view-home" class="page-view">
                <!-- Formulaire d'ajout rapide -->
                <section class="mb-10 bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                    <form id="task-form" class="flex flex-col md:flex-row gap-4">
                        <div class="flex-1 relative">
                            <i data-lucide="plus" class="absolute left-4 top-3 w-5 h-5 text-slate-400"></i>
                            <input type="text" id="task-title" placeholder="Nouvelle mission..." required
                                class="w-full pl-12 pr-4 py-3 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all">
                        </div>
                        <select id="task-priority" class="px-6 py-3 bg-slate-50 border-none rounded-2xl focus:outline-none font-medium text-slate-600 cursor-pointer">
                            <option value="low">Basse</option>
                            <option value="medium" selected>Moyenne</option>
                            <option value="high">Haute</option>
                        </select>
                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-2xl font-bold transition-all flex items-center justify-center gap-2 shadow-lg shadow-indigo-200">
                            Ajouter
                        </button>
                    </form>
                </section>

                <!-- Colonnes Kanban -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="kanban-column">
                        <h3 class="font-extrabold text-slate-400 mb-6 flex items-center justify-between px-2 text-sm tracking-widest uppercase">
                            Backlog <span class="bg-slate-200 text-slate-600 px-3 py-1 rounded-full text-[10px]" id="todo-count">0</span>
                        </h3>
                        <div id="col-todo" class="space-y-4 min-h-[200px] kanban-column-content"></div>
                    </div>
                    <div class="kanban-column">
                        <h3 class="font-extrabold text-indigo-500 mb-6 flex items-center justify-between px-2 text-sm tracking-widest uppercase">
                            Production <span class="bg-indigo-100 text-indigo-600 px-3 py-1 rounded-full text-[10px]" id="doing-count">0</span>
                        </h3>
                        <div id="col-doing" class="space-y-4 min-h-[200px] kanban-column-content"></div>
                    </div>
                    <div class="kanban-column">
                        <h3 class="font-extrabold text-emerald-500 mb-6 flex items-center justify-between px-2 text-sm tracking-widest uppercase">
                            Terminé <span class="bg-emerald-100 text-emerald-600 px-3 py-1 rounded-full text-[10px]" id="done-count">0</span>
                        </h3>
                        <div id="col-done" class="space-y-4 min-h-[200px] kanban-column-content"></div>
                    </div>
                </div>
            </div>

            <!-- VUE : PAGES DE DÉTAILS -->
            <div id="view-details" class="page-view hidden">
                <div id="detail-content" class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 min-h-[400px]">
                    <!-- Contenu injecté ici -->
                </div>
            </div>

        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, updateDoc, deleteDoc, Timestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBC0gg7v8KQltQskGo6PUaFq_megSwlixQ",
            authDomain: "capdavid-5cb65.firebaseapp.com",
            databaseURL: "https://capdavid-5cb65-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "capdavid-5cb65",
            storageBucket: "capdavid-5cb65.firebasestorage.app",
            messagingSenderId: "346917679110",
            appId: "1:346917679110:web:2b76ad31621eec618ed387",
            measurementId: "G-GHTM9M5WCD"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const appId = "david-medical-tracker";
        const tasksCollection = collection(db, 'artifacts', appId, 'public', 'data', 'tasks');

        let currentUser = null;
        let allTasks = [];
        let currentPage = 'home';

        const taskForm = document.getElementById('task-form');
        const viewHome = document.getElementById('view-home');
        const viewDetails = document.getElementById('view-details');
        const detailContent = document.getElementById('detail-content');

        const refreshIcons = () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
        };

        // Navigation
        function navigateTo(pageId) {
            currentPage = pageId;
            
            // UI des onglets
            document.querySelectorAll('.stat-card').forEach(card => {
                card.classList.toggle('active', card.dataset.page === pageId);
            });

            if (pageId === 'home') {
                viewHome.classList.remove('hidden');
                viewDetails.classList.add('hidden');
            } else {
                viewHome.classList.add('hidden');
                viewDetails.classList.remove('hidden');
                renderDetailPage(pageId);
            }
        }

        function renderDetailPage(pageId) {
            let html = "";
            switch(pageId) {
                case 'encours':
                    const doingTasks = allTasks.filter(t => t.status === 'doing');
                    html = `
                        <div class="flex items-center gap-3 mb-6">
                            <div class="p-3 bg-amber-100 rounded-2xl text-amber-600"><i data-lucide="play" class="w-6 h-6"></i></div>
                            <h2 class="text-3xl font-extrabold text-slate-800">Missions en Production</h2>
                        </div>
                        <div class="grid gap-4">
                            ${doingTasks.length > 0 
                                ? doingTasks.map(t => `<div class="p-5 border-l-4 border-amber-400 bg-amber-50/30 rounded-r-xl font-bold text-slate-700 shadow-sm">${t.title}</div>`).join('') 
                                : '<p class="text-slate-400 italic">Aucune mission en cours de production.</p>'}
                        </div>
                    `;
                    break;
                case 'terminees':
                    const doneTasks = allTasks.filter(t => t.status === 'done');
                    html = `
                        <div class="flex items-center gap-3 mb-6">
                            <div class="p-3 bg-emerald-100 rounded-2xl text-emerald-600"><i data-lucide="check" class="w-6 h-6"></i></div>
                            <h2 class="text-3xl font-extrabold text-slate-800">Historique des Succès</h2>
                        </div>
                        <div class="grid gap-4">
                            ${doneTasks.length > 0 
                                ? doneTasks.map(t => `<div class="p-5 border-l-4 border-emerald-400 bg-emerald-50/30 rounded-r-xl font-bold text-slate-700 shadow-sm">${t.title}</div>`).join('') 
                                : '<p class="text-slate-400 italic">Aucune mission terminée pour le moment.</p>'}
                        </div>
                    `;
                    break;
                case 'progression':
                    const done = allTasks.filter(t => t.status === 'done').length;
                    const total = allTasks.length;
                    const percent = total === 0 ? 0 : Math.round((done / total) * 100);
                    html = `
                        <div class="flex items-center gap-3 mb-6">
                            <div class="p-3 bg-indigo-100 rounded-2xl text-indigo-600"><i data-lucide="trending-up" class="w-6 h-6"></i></div>
                            <h2 class="text-3xl font-extrabold text-slate-800">Analyse de la Progression</h2>
                        </div>
                        <div class="mb-10">
                            <div class="flex justify-between mb-2 font-bold text-slate-600">
                                <span>Global</span>
                                <span>${percent}%</span>
                            </div>
                            <div class="w-full bg-slate-100 h-6 rounded-full overflow-hidden border border-slate-200">
                                <div class="bg-indigo-600 h-full transition-all duration-1000 shadow-inner" style="width: ${percent}%"></div>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                             <div class="p-6 bg-slate-50 rounded-3xl border border-slate-100 text-center">
                                <p class="text-slate-400 text-sm font-bold uppercase mb-2">Complétées</p>
                                <span class="text-4xl font-black text-indigo-600">${done}</span>
                             </div>
                             <div class="p-6 bg-slate-50 rounded-3xl border border-slate-100 text-center">
                                <p class="text-slate-400 text-sm font-bold uppercase mb-2">En attente</p>
                                <span class="text-4xl font-black text-slate-400">${total - done}</span>
                             </div>
                        </div>
                    `;
                    break;
            }
            detailContent.innerHTML = html;
            refreshIcons();
        }

        // Firebase & Data logic
        async function initAuth() {
            try { await signInAnonymously(auth); } catch (e) { console.error(e); }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                onSnapshot(tasksCollection, (snapshot) => {
                    allTasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    renderTasks(allTasks);
                    updateStats(allTasks);
                    if (currentPage !== 'home') renderDetailPage(currentPage);
                });
            }
        });

        async function addTask(e) {
            e.preventDefault();
            const title = document.getElementById('task-title').value.trim();
            const priority = document.getElementById('task-priority').value;
            if (title && currentUser) {
                await addDoc(tasksCollection, {
                    title, priority, status: 'todo',
                    createdAt: Timestamp.now(), createdBy: currentUser.uid
                });
                document.getElementById('task-title').value = '';
            }
        }

        function renderTasks(tasks) {
            const cols = { todo: 'col-todo', doing: 'col-doing', done: 'col-done' };
            Object.values(cols).forEach(id => document.getElementById(id).innerHTML = '');
            
            tasks.forEach(task => {
                const card = document.createElement('div');
                card.className = 'task-card bg-white p-5 rounded-2xl shadow-sm border border-slate-100 group';
                const pColor = { low: 'bg-blue-50 text-blue-600', medium: 'bg-amber-50 text-amber-600', high: 'bg-rose-50 text-rose-600' };
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <span class="text-[10px] font-bold uppercase px-2 py-1 rounded-lg ${pColor[task.priority]}">${task.priority}</span>
                        <button class="delete-btn text-slate-200 hover:text-rose-500 transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                    <h4 class="font-semibold text-slate-800 mb-5 leading-tight">${task.title}</h4>
                    <div class="flex flex-wrap gap-2">
                        ${task.status !== 'todo' ? `<button class="move-btn bg-slate-50 text-slate-400 p-2 rounded-xl text-[10px] font-bold hover:bg-slate-100" data-status="todo">Backlog</button>` : ''}
                        ${task.status !== 'doing' ? `<button class="move-btn bg-indigo-50 text-indigo-600 p-2 rounded-xl text-[10px] font-bold hover:bg-indigo-100" data-status="doing">Prod</button>` : ''}
                        ${task.status !== 'done' ? `<button class="move-btn bg-emerald-50 text-emerald-600 p-2 rounded-xl text-[10px] font-bold hover:bg-emerald-100" data-status="done">Finir</button>` : ''}
                    </div>
                `;

                card.querySelector('.delete-btn').onclick = () => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'tasks', task.id));
                card.querySelectorAll('.move-btn').forEach(btn => {
                    btn.onclick = () => updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'tasks', task.id), { status: btn.dataset.status });
                });
                document.getElementById(cols[task.status]).appendChild(card);
            });
            refreshIcons();
            
            ['todo', 'doing', 'done'].forEach(s => document.getElementById(`${s}-count`).innerText = tasks.filter(t => t.status === s).length);
        }

        function updateStats(tasks) {
            const done = tasks.filter(t => t.status === 'done').length;
            const total = tasks.length;
            const doing = tasks.filter(t => t.status === 'doing').length;
            const percent = total === 0 ? 0 : Math.round((done / total) * 100);

            document.getElementById('progress-percent').innerText = `${percent}%`;
            document.getElementById('doing-count-stat').innerText = doing;
            document.getElementById('completed-tasks-count').innerText = done;
        }

        // Listeners
        document.querySelectorAll('.stat-card').forEach(card => {
            card.onclick = () => navigateTo(card.dataset.page);
        });
        document.getElementById('header-home').onclick = () => navigateTo('home');
        taskForm.onsubmit = addTask;

        initAuth();
    </script>
</body>
</html>
