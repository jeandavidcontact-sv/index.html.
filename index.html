<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAVID MÉDICAL - Suivi de Projet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            color: #334155;
            background-color: #f8fafc;
        }

        .premium-header {
            background: linear-gradient(135deg, #0f172a 0%, #334155 100%);
            border-radius: 2rem;
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .nav-tab {
            transition: all 0.2s ease;
            position: relative;
            padding: 0.75rem 1.25rem;
            border-radius: 1rem;
        }

        .nav-tab.active {
            background-color: #0f172a;
            color: white;
            box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.1);
        }

        /* Boutons de suppression forcés en rouge */
        .saas-delete-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ef4444; /* Rouge par défaut */
            transition: all 0.2s ease;
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
        }

        .saas-delete-btn:hover {
            background-color: #fee2e2;
            transform: scale(1.1);
        }

        .category-card {
            background: #f1f5f9;
            border-radius: 2rem;
            border: 1px solid #e2e8f0;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            transition: all 0.3s ease;
            border-top: 4px solid #06b6d4;
        }

        .category-card:hover {
            border-color: #06b6d4;
            transform: translateY(-2px);
        }

        .task-item {
            border-radius: 1.25rem;
            padding: 1rem 1.25rem;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
        }

        .task-item:hover {
            border-color: #06b6d4;
        }

        .task-done {
            opacity: 0.6;
            background-color: #f8fafc;
            border-color: #f1f5f9;
            box-shadow: none;
        }

        .status-badge {
            cursor: pointer;
            font-size: 9px;
            font-weight: 800;
            padding: 0.4rem 0.8rem;
            border-radius: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .date-container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: #f8fafc;
            padding: 0.3rem 0.6rem;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
        }

        .late-badge {
            background: #fef2f2;
            color: #ef4444;
            border: 1px solid #fee2e2;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 2px;
            animation: pulse-soft 2s infinite;
        }

        @keyframes pulse-soft {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        #confirm-modal, #notif-modal, #late-info-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-card {
            background: white;
            padding: 2rem;
            border-radius: 2rem;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-card {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="app" class="max-w-6xl mx-auto">
        
        <header class="premium-header text-white p-12 md:p-16 mb-8 shadow-xl relative overflow-hidden text-center">
            <div class="absolute top-0 left-0 w-full h-full opacity-10 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:20px_20px]"></div>
            
            <div class="absolute top-6 right-6 z-20">
                <button id="notif-bell" class="p-3 bg-white/5 hover:bg-white/10 rounded-xl transition-all border border-white/10 relative">
                    <i data-lucide="bell" class="w-5 h-5"></i>
                    <span id="notif-badge" class="absolute -top-1 -right-1 bg-cyan-400 text-slate-900 text-[9px] font-black w-5 h-5 rounded-full flex items-center justify-center hidden border-2 border-[#0f172a]">0</span>
                </button>
            </div>

            <div class="relative z-10">
                <h1 class="text-4xl md:text-6xl font-black tracking-tight mb-2">D.M. SUIVI</h1>
                <p class="text-cyan-400 font-bold tracking-[0.2em] uppercase text-[10px] opacity-90">Plateforme de coordination médicale</p>
            </div>
        </header>

        <div class="glass-nav flex items-center gap-2 mb-8 p-2 rounded-2xl sticky top-4 z-50 shadow-sm">
            <nav id="tabs-container" class="flex items-center gap-1 overflow-x-auto flex-grow px-1">
            </nav>
            <button id="add-tab-btn" class="flex items-center gap-2 px-5 py-2.5 text-white bg-cyan-600 hover:bg-cyan-500 font-bold text-xs uppercase tracking-wider rounded-xl transition-all active:scale-95 shadow-lg shadow-cyan-900/10">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Nouveau</span>
            </button>
        </div>

        <main id="main-content" class="bg-white p-6 md:p-10 rounded-[2.5rem] border border-slate-200 shadow-sm min-h-[500px]">
        </main>
        
    </div>

    <!-- Modales -->
    <div id="notif-modal">
        <div class="modal-card">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                    <i data-lucide="alert-triangle" class="w-5 h-5 text-cyan-500"></i> Alertes
                </h3>
                <button id="close-notif-btn" class="p-2 hover:bg-slate-100 rounded-lg"><i data-lucide="x" class="w-5 h-5 text-slate-400"></i></button>
            </div>
            <div id="notif-list" class="flex flex-col gap-2 max-h-[300px] overflow-y-auto pr-1"></div>
            <button id="dismiss-notif-btn" class="w-full mt-6 py-3 bg-slate-900 text-white font-bold rounded-xl text-sm transition-all">Compris</button>
        </div>
    </div>

    <div id="late-info-modal">
        <div class="modal-card text-center">
            <div class="w-12 h-12 bg-rose-50 text-rose-500 rounded-xl flex items-center justify-center mb-4 mx-auto"><i data-lucide="clock" class="w-6 h-6"></i></div>
            <h3 class="text-lg font-bold text-slate-900 mb-1">Délai dépassé</h3>
            <p id="late-info-text" class="text-slate-500 text-xs mb-6"></p>
            <button onclick="document.getElementById('late-info-modal').style.display='none'" class="w-full py-3 bg-slate-900 text-white font-bold rounded-xl text-sm">Fermer</button>
        </div>
    </div>

    <div id="confirm-modal">
        <div class="modal-card text-center">
            <div class="w-12 h-12 bg-rose-50 text-rose-500 rounded-xl flex items-center justify-center mb-4 mx-auto"><i data-lucide="trash-2" class="w-6 h-6"></i></div>
            <h3 class="text-lg font-bold text-slate-900 mb-1">Confirmer ?</h3>
            <p id="confirm-desc" class="text-slate-500 text-xs mb-6">Cette action est définitive.</p>
            <div class="flex gap-2">
                <button id="confirm-delete-btn" class="flex-1 py-3 bg-rose-500 text-white font-bold rounded-xl text-sm transition-all active:scale-95">Supprimer</button>
                <button id="cancel-delete-btn" class="flex-1 py-3 bg-slate-100 text-slate-600 font-bold rounded-xl text-sm transition-all active:scale-95">Annuler</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyBC0gg7v8KQltQskGo6PUaFq_megSwlixQ", authDomain: "capdavid-5cb65.firebaseapp.com", projectId: "capdavid-5cb65" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        const STATES = {
            'todo': { label: 'À faire', bg: 'bg-slate-100', text: 'text-slate-500' },
            'in-progress': { label: 'En cours', bg: 'bg-cyan-100', text: 'text-cyan-700' },
            'done': { label: 'Terminée', bg: 'bg-emerald-100', text: 'text-emerald-700' }
        };

        let tabs = [
            { id: 'dashboard', title: 'Dashboard', isDashboard: true, categories: [] },
            { id: 'tab2', title: 'Clinique Pasteur', isDashboard: false, categories: [
                { id: 'cat1', title: 'Déploiement Logiciel', tasks: [
                    { id: 't1', text: 'Configuration des serveurs', status: 'done', date: '2024-03-20' },
                    { id: 't2', text: 'Formation du personnel', status: 'in-progress', date: '2024-03-28' },
                    { id: 't3', text: 'Audit de sécurité initial', status: 'todo', date: '2024-01-15' }
                ]}
            ]}
        ];
        
        let activeTabId = 'dashboard';
        let pendingDeleteAction = null;

        const container = document.getElementById('tabs-container');
        const contentArea = document.getElementById('main-content');

        function formatDateFR(dateStr) {
            if (!dateStr) return '---';
            const parts = dateStr.split('-');
            if (parts.length !== 3) return dateStr;
            return `${parts[2]}-${parts[1]}-${parts[0]}`;
        }
        
        function render() {
            renderTabs();
            renderContent();
            updateNotifications();
            if (window.lucide) window.lucide.createIcons();
        }

        function isLate(dateStr, status) {
            if (!dateStr || status === 'done') return false;
            const today = new Date().toISOString().split('T')[0];
            return dateStr < today;
        }

        function updateNotifications() {
            const today = new Date().toISOString().split('T')[0];
            const lateTasks = [];
            tabs.forEach(tab => {
                if (tab.isDashboard) return;
                tab.categories.forEach(cat => {
                    cat.tasks.forEach(task => {
                        if (task.status !== 'done' && task.date && task.date < today) {
                            lateTasks.push({ ...task, tabTitle: tab.title });
                        }
                    });
                });
            });

            const badge = document.getElementById('notif-badge');
            if (lateTasks.length > 0) {
                badge.innerText = lateTasks.length;
                badge.classList.remove('hidden');
                document.getElementById('notif-list').innerHTML = lateTasks.map(task => `
                    <div class="p-3 bg-rose-50 border border-rose-100 rounded-xl">
                        <div class="text-[8px] font-black uppercase text-slate-400 mb-0.5">${task.tabTitle}</div>
                        <div class="text-xs font-bold text-slate-800">${task.text}</div>
                        <div class="text-[9px] text-rose-600 font-bold mt-1">Échéance : ${formatDateFR(task.date)}</div>
                    </div>
                `).join('');
            } else {
                badge.classList.add('hidden');
                document.getElementById('notif-list').innerHTML = '<p class="text-center py-6 text-slate-400 text-xs">Aucune alerte</p>';
            }
        }

        function renderTabs() {
            container.innerHTML = '';
            tabs.forEach(tab => {
                const isActive = tab.id === activeTabId;
                const tabEl = document.createElement('div');
                tabEl.className = `nav-tab cursor-pointer text-[10px] font-bold uppercase tracking-wider flex items-center ${isActive ? 'active' : 'text-slate-500 hover:text-slate-800'}`;
                tabEl.innerHTML = `<span>${tab.title}</span>`;
                if (!tab.isDashboard) {
                    const del = document.createElement('button');
                    // Couleur rouge explicite
                    del.className = 'saas-delete-btn ml-2';
                    del.innerHTML = '<i data-lucide="trash-2" class="w-3.5 h-3.5"></i>';
                    del.onclick = (e) => { 
                        e.stopPropagation(); 
                        pendingDeleteAction = () => deleteTab(tab.id); 
                        document.getElementById('confirm-desc').innerText = `Voulez-vous supprimer le projet "${tab.title}" ?`;
                        document.getElementById('confirm-modal').style.display='flex'; 
                    };
                    tabEl.appendChild(del);
                }
                tabEl.onclick = () => { activeTabId = tab.id; render(); };
                container.appendChild(tabEl);
            });
        }

        function renderContent() {
            const activeTab = tabs.find(t => t.id === activeTabId);
            if (!activeTab) return;

            if (activeTab.isDashboard) {
                contentArea.innerHTML = `<h2 class="text-2xl font-black text-slate-900 mb-4">Tableau de Bord</h2><p class="text-slate-500 text-sm">Sélectionnez un projet pour commencer.</p>`;
                return;
            }

            contentArea.innerHTML = `
                <div class="flex flex-col gap-8">
                    <div class="flex items-center justify-between gap-4">
                        <input type="text" value="${activeTab.title}" class="font-black text-slate-900 text-3xl outline-none w-full bg-transparent focus:text-cyan-600" onblur="window.updateTabTitle('${activeTab.id}', this.value)">
                        <button onclick="window.addCategory()" class="shrink-0 px-6 py-3 bg-slate-900 text-white rounded-xl text-[10px] font-bold uppercase tracking-widest hover:bg-slate-800 transition-all">Ajouter Section</button>
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        ${activeTab.categories.map((cat, idx) => {
                            const sortedTasks = [...cat.tasks].sort((a, b) => {
                                const aLate = isLate(a.date, a.status);
                                const bLate = isLate(b.date, b.status);
                                const aDone = a.status === 'done';
                                const bDone = b.status === 'done';
                                if (aDone && !bDone) return 1;
                                if (!aDone && bDone) return -1;
                                if (aLate && !bLate) return -1;
                                if (!aLate && bLate) return 1;
                                if (a.date && b.date) return a.date.localeCompare(b.date);
                                return 0;
                            });

                            return `
                                <div class="category-card p-6 flex flex-col gap-6 animate-card" style="animation-delay: ${idx * 0.05}s">
                                    <div class="flex items-center justify-between gap-2">
                                        <input type="text" value="${cat.title}" class="font-bold text-slate-800 text-lg outline-none w-full bg-transparent" onblur="window.updateCategoryTitle('${cat.id}', this.value)">
                                        <button onclick="window.confirmDeleteCategory('${cat.id}', '${cat.title.replace(/'/g, "\\'")}')" class="saas-delete-btn">
                                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                                        </button>
                                    </div>
                                    <div class="flex flex-col gap-3">
                                        ${sortedTasks.map(task => {
                                            const isDone = task.status === 'done';
                                            const state = STATES[task.status];
                                            const taskIsLate = isLate(task.date, task.status);
                                            const displayDate = formatDateFR(task.date);
                                            return `
                                                <div class="task-item flex items-center justify-between gap-4 ${isDone ? 'task-done' : ''}">
                                                    <div class="flex flex-col gap-1.5 flex-grow">
                                                        <input type="text" value="${task.text}" class="text-sm font-semibold text-slate-700 outline-none bg-transparent" onblur="window.updateTaskText('${cat.id}', '${task.id}', this.value)">
                                                        <div class="flex items-center gap-2">
                                                            <div class="date-container w-fit">
                                                                <i data-lucide="calendar" class="w-3 h-3"></i>
                                                                <span>${displayDate}</span>
                                                                <input type="date" value="${task.date || ''}" class="absolute inset-0 opacity-0 cursor-pointer" onchange="window.updateTaskDate('${cat.id}', '${task.id}', this.value)">
                                                            </div>
                                                            ${taskIsLate ? `
                                                                <div class="late-badge cursor-pointer" onclick="window.showLateInfo('${task.text.replace(/'/g, "\\'")}', '${displayDate}')">
                                                                    <i data-lucide="clock" class="w-2 h-2"></i> Retard
                                                                </div>
                                                            ` : ''}
                                                        </div>
                                                    </div>
                                                    <div class="flex items-center gap-3">
                                                        <div onclick="window.cycleStatus('${cat.id}', '${task.id}')" class="status-badge ${state.bg} ${state.text}">${state.label}</div>
                                                        <button onclick="window.confirmDeleteTask('${cat.id}', '${task.id}', '${task.text.replace(/'/g, "\\'")}')" class="saas-delete-btn">
                                                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                                                        </button>
                                                    </div>
                                                </div>
                                            `;
                                        }).join('')}
                                        <input type="text" placeholder="+ Ajouter une tâche..." class="w-full bg-transparent px-4 py-3 rounded-xl text-xs font-bold outline-none border border-dashed border-slate-300 focus:border-cyan-400 focus:border-solid transition-all" onkeydown="if(event.key === 'Enter' && this.value.trim()) { window.addTask('${cat.id}', this.value); this.value=''; }">
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        window.showLateInfo = (name, formattedDate) => {
            document.getElementById('late-info-text').innerText = `La tâche "${name}" était prévue pour le ${formattedDate}. Elle est actuellement en retard.`;
            document.getElementById('late-info-modal').style.display = 'flex';
        };

        window.updateTabTitle = (id, v) => { const t = tabs.find(x => x.id === id); if(t) t.title = v; renderTabs(); };
        window.addCategory = () => { const activeTab = tabs.find(t => t.id === activeTabId); activeTab.categories.push({ id: 'cat' + Date.now(), title: 'Section', tasks: [] }); render(); };
        window.updateCategoryTitle = (catId, newTitle) => { const activeTab = tabs.find(t => t.id === activeTabId); const cat = activeTab.categories.find(c => c.id === catId); if (cat) cat.title = newTitle; };
        
        window.confirmDeleteCategory = (catId, catTitle) => { 
            pendingDeleteAction = () => { 
                const activeTab = tabs.find(t => t.id === activeTabId); 
                activeTab.categories = activeTab.categories.filter(c => c.id !== catId); 
            }; 
            document.getElementById('confirm-desc').innerText = `Voulez-vous supprimer la section "${catTitle}" et toutes ses tâches ?`;
            document.getElementById('confirm-modal').style.display='flex'; 
        };

        window.confirmDeleteTask = (catId, taskId, taskText) => {
            pendingDeleteAction = () => {
                const activeTab = tabs.find(t => t.id === activeTabId);
                const cat = activeTab.categories.find(c => c.id === catId);
                if (cat) cat.tasks = cat.tasks.filter(tk => tk.id !== taskId);
            };
            document.getElementById('confirm-desc').innerText = `Voulez-vous supprimer la tâche "${taskText}" ?`;
            document.getElementById('confirm-modal').style.display='flex';
        };

        window.addTask = (catId, text) => { const activeTab = tabs.find(t => t.id === activeTabId); const cat = activeTab.categories.find(c => c.id === catId); cat.tasks.push({ id: 'task' + Date.now(), text, status: 'todo', date: new Date().toISOString().split('T')[0] }); render(); };
        window.updateTaskText = (cid, tid, text) => { const cat = tabs.find(t => t.id === activeTabId).categories.find(c => c.id === cid); const task = cat.tasks.find(tk => tk.id === tid); task.text = text; };
        window.updateTaskDate = (cid, tid, date) => { const cat = tabs.find(t => t.id === activeTabId).categories.find(c => c.id === cid); const task = cat.tasks.find(tk => tk.id === tid); task.date = date; render(); };
        window.cycleStatus = (cid, tid) => { const cat = tabs.find(t => t.id === activeTabId).categories.find(c => c.id === cid); const task = cat.tasks.find(tk => tk.id === tid); const order = ['todo', 'in-progress', 'done']; task.status = order[(order.indexOf(task.status) + 1) % 3]; render(); };
        
        function deleteTab(id) { tabs = tabs.filter(t => t.id !== id); if (activeTabId === id) activeTabId = 'dashboard'; render(); }

        document.getElementById('confirm-delete-btn').onclick = () => { if(pendingDeleteAction) pendingDeleteAction(); document.getElementById('confirm-modal').style.display='none'; render(); };
        document.getElementById('cancel-delete-btn').onclick = () => { pendingDeleteAction = null; document.getElementById('confirm-modal').style.display='none'; };
        document.getElementById('notif-bell').onclick = () => { document.getElementById('notif-modal').style.display='flex'; if(window.lucide) window.lucide.createIcons(); };
        document.getElementById('close-notif-btn').onclick = document.getElementById('dismiss-notif-btn').onclick = () => document.getElementById('notif-modal').style.display='none';
        document.getElementById('add-tab-btn').onclick = () => { const id = 'tab' + Date.now(); tabs.push({ id, title: 'Nouveau Projet', isDashboard: false, categories: [] }); activeTabId = id; render(); };

        async function initAuth() { try { await signInAnonymously(auth); render(); } catch (e) { render(); } }
        initAuth();
    </script>
</body>
</html>
