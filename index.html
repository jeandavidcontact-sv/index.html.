<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Médical - Dashboard Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --dark-navy: #111827;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .dark-header {
            background-color: var(--dark-navy);
            color: white;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
        }

        .tab-btn {
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .tab-btn.active {
            background-color: white;
            color: var(--dark-navy);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .countdown-value {
            font-size: 1.75rem;
            font-weight: 800;
        }

        .glass-card {
            background: white;
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 24px;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
        }

        .progress-bar-bg {
            background-color: #f1f5f9;
            height: 8px;
            border-radius: 4px;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .health-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .animate-fade { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.6;
            filter: invert(0.5);
        }

        /* Loading Overlay */
        #loading-overlay {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
        }
    </style>
</head>
<body class="min-h-screen">

    <div id="loading-overlay">
        <div class="w-12 h-12 border-4 border-slate-200 border-t-indigo-600 rounded-full animate-spin"></div>
        <p class="text-slate-500 font-bold text-sm tracking-widest uppercase">Connexion au Cloud...</p>
    </div>

    <!-- HEADER -->
    <header class="dark-header w-full px-6 py-8 sm:px-12 shadow-2xl mb-8">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
            
            <div class="health-badge flex items-center gap-4 px-5 py-3 rounded-2xl border border-white/10">
                <div>
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-[10px] font-bold text-emerald-400 tracking-widest uppercase">SANTÉ</span>
                        <div id="health-indicators" class="flex gap-1"></div>
                    </div>
                    <div class="flex items-center">
                        <span id="late-badge" class="bg-white/10 text-[10px] px-2 py-0.5 rounded text-white/70 font-bold tracking-tight">0 Retard</span>
                    </div>
                </div>
            </div>

            <div class="text-center">
                <h1 class="text-4xl md:text-5xl font-black tracking-tighter mb-4 uppercase">DAVID MÉDICAL</h1>
                <div class="flex justify-center items-center gap-8 border-t border-white/10 pt-4">
                    <div class="flex flex-col">
                        <span id="days" class="countdown-value">000</span>
                        <span class="text-[10px] uppercase tracking-widest text-white/40 font-bold">Jours</span>
                    </div>
                    <div class="w-[1px] h-10 bg-white/10"></div>
                    <div class="flex flex-col">
                        <span id="hours" class="countdown-value">00</span>
                        <span class="text-[10px] uppercase tracking-widest text-white/40 font-bold">Heures</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <button class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition-all border border-white/5 relative">
                    <i class="fas fa-bell text-sm"></i>
                    <span id="notif-dot" class="absolute top-3 right-3 w-2 h-2 bg-red-500 rounded-full hidden"></span>
                </button>
                <button onclick="exportData()" class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition-all border border-white/5">
                    <i class="fas fa-download text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- NAVIGATION TABS -->
    <div class="max-w-7xl mx-auto px-6 mb-8">
        <div class="bg-slate-200/50 p-1.5 rounded-2xl flex items-center gap-1 overflow-x-auto no-scrollbar">
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="tab-btn px-6 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-2">
                Tableau de bord
            </button>
            <div id="dynamic-tabs" class="flex items-center gap-1"></div>
            <button onclick="addNewPole()" class="ml-auto w-10 h-10 flex items-center justify-center text-slate-500 hover:text-indigo-600 transition-colors">
                <i class="fas fa-plus-circle text-lg"></i>
            </button>
        </div>
    </div>

    <!-- MAIN CONTENT AREA -->
    <main id="main-content" class="max-w-7xl mx-auto px-6 pb-20"></main>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBC0gg7v8KQltQskGo6PUaFq_megSwlixQ",
            authDomain: "capdavid-5cb65.firebaseapp.com",
            databaseURL: "https://capdavid-5cb65-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "capdavid-5cb65",
            storageBucket: "capdavid-5cb65.firebasestorage.app",
            messagingSenderId: "346917679110",
            appId: "1:346917679110:web:2b76ad31621eec618ed387",
            measurementId: "G-GHTM9M5WCD"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'capdavid-5cb65';

        // State
        let state = {
            poles: [],
            activeTab: 'dashboard'
        };
        let currentUser = null;

        // AUTHENTICATION
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth error:", error);
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                startDataSync();
            }
        });

        // DATA SYNC
        const startDataSync = () => {
            const stateDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'mainState');
            
            onSnapshot(stateDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    state = docSnap.data();
                } else {
                    // Initial data if cloud is empty
                    state = {
                        poles: [
                            { id: 'pole-1', name: 'Mobiliers / Immobiliers', categories: [] },
                            { id: 'pole-2', name: 'Juridique / Administratif', categories: [] }
                        ],
                        activeTab: 'dashboard'
                    };
                    saveToCloud();
                }
                document.getElementById('loading-overlay').style.display = 'none';
                render();
            }, (error) => {
                console.error("Firestore sync error:", error);
                // Fallback to local if error
                document.getElementById('loading-overlay').style.display = 'none';
            });
        };

        const saveToCloud = async () => {
            if (!currentUser) return;
            const stateDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'mainState');
            await setDoc(stateDocRef, state);
        };

        // UI LOGIC
        window.switchTab = (tabId) => {
            state.activeTab = tabId;
            saveToCloud();
        };

        window.addNewPole = () => {
            const name = prompt("Nom du nouveau pôle ?");
            if (name) {
                const id = 'pole-' + Date.now();
                state.poles.push({ id, name, categories: [] });
                state.activeTab = id;
                saveToCloud();
            }
        };

        window.removePole = (id, e) => {
            e.stopPropagation();
            if(confirm("Supprimer ce pôle et tout son contenu ?")) {
                state.poles = state.poles.filter(p => p.id !== id);
                state.activeTab = 'dashboard';
                saveToCloud();
            }
        };

        window.addCategory = (poleId) => {
            const nameInput = document.getElementById(`new-cat-name-${poleId}`);
            if (nameInput.value.trim()) {
                const pole = state.poles.find(p => p.id === poleId);
                pole.categories.push({ id: 'cat-' + Date.now(), name: nameInput.value, tasks: [] });
                nameInput.value = '';
                saveToCloud();
            }
        };

        window.addTask = (poleId, catId) => {
            const textInput = document.getElementById(`task-input-${catId}`);
            const dateInput = document.getElementById(`task-date-${catId}`);
            
            if (textInput.value.trim()) {
                const pole = state.poles.find(p => p.id === poleId);
                const cat = pole.categories.find(c => c.id === catId);
                cat.tasks.push({ 
                    id: Date.now(), 
                    text: textInput.value, 
                    date: dateInput.value || null,
                    done: false 
                });
                textInput.value = '';
                dateInput.value = '';
                saveToCloud();
            }
        };

        window.toggleTask = (poleId, catId, taskId) => {
            const pole = state.poles.find(p => p.id === poleId);
            const cat = pole.categories.find(c => c.id === catId);
            const task = cat.tasks.find(t => t.id === taskId);
            task.done = !task.done;
            saveToCloud();
        };

        window.removeCategory = (poleId, catId) => {
            const pole = state.poles.find(p => p.id === poleId);
            pole.categories = pole.categories.filter(c => c.id !== catId);
            saveToCloud();
        };

        const targetDate = new Date('2026-09-01T08:30:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;
            const daysEl = document.getElementById('days');
            const hoursEl = document.getElementById('hours');
            if (daysEl && hoursEl) {
                daysEl.innerText = Math.max(0, Math.floor(distance / (1000 * 60 * 60 * 24))).toString().padStart(3, '0');
                hoursEl.innerText = Math.max(0, Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).toString().padStart(2, '0');
            }
        }
        setInterval(updateCountdown, 1000);

        function isLate(task) {
            if (task.done || !task.date) return false;
            const today = new Date().setHours(0,0,0,0);
            const taskDate = new Date(task.date).setHours(0,0,0,0);
            return taskDate < today;
        }

        function updateGlobalHealth() {
            let totalLate = 0;
            state.poles.forEach(p => {
                p.categories.forEach(c => {
                    totalLate += c.tasks.filter(t => isLate(t)).length;
                });
            });

            const lateBadge = document.getElementById('late-badge');
            if(lateBadge) lateBadge.innerText = `${totalLate} Retard${totalLate > 1 ? 's' : ''}`;
            
            const notifDot = document.getElementById('notif-dot');
            if(notifDot) totalLate > 0 ? notifDot.classList.remove('hidden') : notifDot.classList.add('hidden');

            const healthContainer = document.getElementById('health-indicators');
            if(!healthContainer) return;

            let bars = '';
            const barCount = 4;
            const activeBars = totalLate === 0 ? 4 : (totalLate < 3 ? 3 : (totalLate < 6 ? 2 : 1));
            
            for(let i=0; i<barCount; i++) {
                const color = activeBars > 1 ? 'bg-emerald-500' : 'bg-red-500';
                const opacity = i < activeBars ? '' : '/20';
                bars += `<div class="w-3 h-1 ${color}${opacity} rounded-full transition-all"></div>`;
            }
            healthContainer.innerHTML = bars;
        }

        function render() {
            updateGlobalHealth();
            const dynamicTabs = document.getElementById('dynamic-tabs');
            const mainContent = document.getElementById('main-content');
            
            dynamicTabs.innerHTML = state.poles.map(p => `
                <button onclick="switchTab('${p.id}')" class="tab-btn ${state.activeTab === p.id ? 'active' : 'text-slate-500'} px-5 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-2">
                    ${p.name} <i onclick="removePole('${p.id}', event)" class="fas fa-times text-[10px] opacity-30 hover:opacity-100"></i>
                </button>
            `).join('');

            const dashTab = document.getElementById('tab-dashboard');
            if(dashTab) dashTab.className = `tab-btn ${state.activeTab === 'dashboard' ? 'active' : 'text-slate-500'} px-6 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-2`;

            if (state.activeTab === 'dashboard') renderDashboard(mainContent);
            else renderPole(mainContent, state.activeTab);
            updateCountdown();
        }

        function renderDashboard(container) {
            container.innerHTML = `
                <div class="animate-fade">
                    <div class="flex items-center gap-3 mb-6">
                        <div class="w-1 h-6 bg-indigo-600 rounded-full"></div>
                        <h2 class="text-2xl font-extrabold text-slate-800 tracking-tight">Fresque Chronologique</h2>
                    </div>
                    
                    <div class="glass-card p-12 text-center mb-12">
                        <p class="text-slate-400 italic font-medium">Connecté au Cloud • Les modifications sont partagées.</p>
                    </div>

                    <h2 class="text-xl font-extrabold text-slate-800 mb-6 tracking-tight">Avancement par pôle</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${state.poles.map(p => {
                            let total = 0, done = 0, late = 0;
                            p.categories.forEach(c => {
                                total += c.tasks.length;
                                done += c.tasks.filter(t => t.done).length;
                                late += c.tasks.filter(t => isLate(t)).length;
                            });
                            const percent = total === 0 ? 0 : Math.round((done / total) * 100);
                            return `
                                <div class="glass-card p-8 hover:shadow-lg transition-shadow cursor-pointer" onclick="switchTab('${p.id}')">
                                    <div class="flex justify-between items-start mb-6">
                                        <h3 class="font-bold text-slate-800 leading-tight">${p.name}</h3>
                                        ${late > 0 ? `<span class="bg-red-100 text-red-600 text-[10px] px-2 py-0.5 rounded-full font-bold">${late} Retard</span>` : ''}
                                    </div>
                                    <div class="flex items-center gap-4">
                                        <div class="progress-bar-bg flex-1">
                                            <div class="progress-bar-fill ${late > 0 ? 'bg-orange-400' : 'bg-indigo-600'}" style="width: ${percent}%"></div>
                                        </div>
                                        <span class="text-sm font-black text-slate-400">${percent}%</span>
                                    </div>
                                    <p class="text-[10px] text-slate-400 mt-4 uppercase font-bold tracking-widest">${total} tâches au total</p>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderPole(container, poleId) {
            const pole = state.poles.find(p => p.id === poleId);
            if(!pole) return;
            container.innerHTML = `
                <div class="animate-fade">
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
                        ${pole.categories.map(cat => `
                            <div class="glass-card p-6">
                                <div class="flex justify-between items-center mb-6">
                                    <h3 class="text-xl font-extrabold text-slate-800">${cat.name}</h3>
                                    <button onclick="removeCategory('${poleId}', '${cat.id}')" class="text-slate-300 hover:text-red-500"><i class="fas fa-trash-alt"></i></button>
                                </div>
                                <div class="space-y-2 mb-6">
                                    ${cat.tasks.map(t => {
                                        const late = isLate(t);
                                        return `
                                            <div onclick="toggleTask('${poleId}', '${cat.id}', ${t.id})" class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl cursor-pointer group hover:bg-slate-100 transition-colors">
                                                <div class="w-5 h-5 rounded border-2 flex items-center justify-center transition-colors ${t.done ? 'bg-indigo-600 border-indigo-600' : 'border-slate-300'}">
                                                    ${t.done ? '<i class="fas fa-check text-white text-[8px]"></i>' : ''}
                                                </div>
                                                <div class="flex-1">
                                                    <p class="text-sm font-semibold ${t.done ? 'line-through text-slate-400' : 'text-slate-700'}">${t.text}</p>
                                                    ${t.date ? `<span class="text-[9px] font-bold ${late ? 'text-red-500' : 'text-slate-400'} uppercase"><i class="far fa-calendar-alt mr-1"></i> ${new Date(t.date).toLocaleDateString('fr-FR')}</span>` : ''}
                                                </div>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                                <div class="space-y-2 bg-slate-50 p-3 rounded-2xl">
                                    <input type="text" id="task-input-${cat.id}" placeholder="Nouvelle tâche..." class="w-full bg-white border border-slate-100 rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                                    <div class="flex gap-2">
                                        <input type="date" id="task-date-${cat.id}" class="flex-1 bg-white border border-slate-100 rounded-xl px-4 py-2 text-xs focus:ring-2 focus:ring-indigo-500 outline-none">
                                        <button onclick="addTask('${poleId}', '${cat.id}')" class="bg-indigo-600 text-white px-4 py-2 rounded-xl flex items-center justify-center hover:bg-indigo-700">
                                            <i class="fas fa-plus mr-2 text-xs"></i> <span class="text-xs font-bold">Ajouter</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}

                        <div class="border-2 border-dashed border-slate-200 rounded-[32px] p-8 text-center bg-white/50">
                            <span class="block text-slate-400 text-[10px] font-black uppercase tracking-[0.2em] mb-8">AJOUTER UNE CATÉGORIE</span>
                            <div class="flex gap-3">
                                <input type="text" id="new-cat-name-${poleId}" placeholder="Nom (ex: CAMION)..." class="flex-1 bg-white border border-slate-100 rounded-xl px-4 py-4 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-slate-200">
                                <button onclick="addCategory('${poleId}')" class="bg-[#1e293b] text-white px-8 py-4 rounded-xl font-bold hover:bg-slate-800 transition-colors">Créer</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        window.exportData = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "david_medical_cloud_backup.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        };

        // Execution
        initAuth();
    </script>
</body>
</html>
